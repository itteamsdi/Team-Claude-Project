# Deploy the SDI 1-2-1 / HR web app (sdi-121-demo-deploy/) to an Apache server over SSH.
#
#   * Test:        runs automatically on every push to main that changes sdi-121-demo-deploy/.
#   * Production:  "promote" by hand: Actions → Deploy web app → Run workflow → environment: production.
#
# Only changed files are uploaded (rsync compares file contents with --checksum).
# Database migrations are NOT deployed by this workflow; run those in Supabase by hand.
#
# One-time setup in GitHub → Settings → Environments. Create "test" and "production",
# and give each one these:
#   Variables:  DEPLOY_HOST   e.g. testteam.servicedeskinstitute.com
#               DEPLOY_PORT   22 for test, 22357 for production
#               DEPLOY_USER   www
#               DEPLOY_PATH   Apache folder for the site (no trailing slash), for test:
#                             /home/www/testteam.servicedeskinstitute.com/htdocs
#   Secrets:    SSH_PRIVATE_KEY   private half of a deploy key whose public half is in
#                                 ~www/.ssh/authorized_keys on that server
#               SSH_KNOWN_HOSTS   output of: ssh-keyscan -p <port> <host>
# Tip: on the "production" environment, add "Required reviewers" and restrict it to the
# main branch, so a promotion needs an approval.

name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "sdi-121-demo-deploy/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [test, production]
        default: test

# Never run two deployments to the same environment at once.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'test' || inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'test' || inputs.environment }}
    steps:
      - name: Only promote from main
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production can only be deployed from the main branch."
          exit 1

      - name: Check out
        uses: actions/checkout@v4

      - name: Check settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          HAS_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ "$HAS_KEY" = "true" ]   || missing="$missing SSH_PRIVATE_KEY"
          [ "$HAS_HOSTS" = "true" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing environment settings:$missing"
            exit 1
          fi
          case "$DEPLOY_PATH" in
            ""|"/"|*" "*) echo "::error::DEPLOY_PATH looks wrong: '$DEPLOY_PATH'"; exit 1 ;;
          esac

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload changed files
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          rsync -rlz --checksum --itemize-changes \
            --exclude "netlify.toml" \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            sdi-121-demo-deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # Files removed from the repo are left on the server. To also delete them,
          # add --delete above (only if DEPLOY_PATH holds nothing but this site).

      - name: Check the site responds
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DEPLOY_HOST/")
          echo "https://$DEPLOY_HOST/ returned HTTP $code"
          [ "$code" = "200" ] || { echo "::warning::Site did not return 200 after deploy."; }

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
