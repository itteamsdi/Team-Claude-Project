        <p>Any company equipment issued to you must be kept safe, secure, and maintained in good working condition at all times. Employees are expected to take reasonable care when using company property and to follow all security, IT, and acceptable use policies.</p>
        <p>You may be required to reimburse the company for the cost of repair or replacement of any equipment that is lost, damaged, or misused as a result of negligence, unauthorised use, or failure to follow company procedures.</p>
        <p>Upon termination of employment, or at any time upon request, all company property must be returned immediately and in good condition. This includes but is not limited to laptops, monitors, mobile phones, tablets, access cards, security tokens, documents, storage devices, and any other equipment or materials belonging to the company.</p>
        <p>You must also provide all passwords, passcodes, authentication methods, and access details required for the company to regain full access to company systems, devices, accounts, files, and information held or accessed as part of your employment. Failure to return company property or provide necessary access credentials may result in deductions where legally permitted, further action by the company, and/or referral to the appropriate authorities. Please email this information to the Chair &amp;amp; CEO.</p>
      </div>
    </div>

    <!-- 10. COMPASSIONATE LEAVE AND FAMILY EMERGENCIES -->
    <div class=&quot;sec-card&quot; id=&quot;s10&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>10</span> Compassionate Leave and Family Emergencies</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Your line manager may approve short periods of leave for serious family emergencies or close family bereavement. Where possible, please seek approval before the absence begins. If this is not possible, make contact as soon as you can. Paid compassionate leave is at the Chair &amp;amp; CEO's discretion and a return-to-work meeting will usually take place when you come back.</p>
      </div>
    </div>

    <!-- 11. CONDUCT -->
    <div class=&quot;sec-card&quot; id=&quot;s11&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>11</span> Conduct</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We are proud of the relationships we have with our customers and colleagues, and we expect everyone to behave with professionalism and respect at all times.</p>
        <p>Your personal conduct outside work is generally your own affair. However, if your behaviour outside work affects your ability to do your job, brings the company into disrepute, or occurs at a work-related social event, it may result in disciplinary action.</p>
        <p>When visiting a client's office or site, attending an away day, or representing SDI at any in person event, the following standards apply:</p>
        <ul>
          <li>Arrive on time and do not take unnecessary breaks.</li>
          <li>Represent SDI professionally at all times when on site.</li>
          <li>No smoking on site.</li>
          <li>Keep mobile phone use to a minimum.</li>
          <li>Maintain a professional appearance and good personal hygiene.</li>
          <li>Report any concerns or incidents to the Chair &amp;amp; CEO.</li>
          <li>Maintain full confidentiality about the client and their personal circumstances.</li>
          <li>Ensure the safety of all individuals on site, particularly vulnerable people.</li>
        </ul>
        <p>Client complaints that result in lost business will be treated as potential gross misconduct. You must also notify us if you receive a criminal conviction during your employment.</p>
      </div>
    </div>

    <!-- 12. DATA PROTECTION -->
    <div class=&quot;sec-card&quot; id=&quot;s12&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>12</span> Data Protection</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We take our data protection obligations seriously and comply with the UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018. This policy applies to all current and former employees, workers, volunteers, interns, apprentices, and consultants.</p>
        <p>The company carries out an annual Cyber Security Audit to review and strengthen our data protection controls. Staff are trained on their data protection responsibilities as part of induction.</p>
        <p>This policy does not form part of your contract of employment and may be updated from time to time. You should read it alongside your contract and any privacy notice we issue to you.</p>
        <h3>The Six Principles</h3>
        <p>All personal data we handle must be:</p>
        <ul>
          <li>Processed fairly, lawfully, and transparently.</li>
          <li>Collected for a specific, legitimate purpose and not used for anything else.</li>
          <li>Adequate, relevant, and limited to what is necessary.</li>
          <li>Accurate and kept up to date.</li>
          <li>Kept only for as long as necessary.</li>
          <li>Kept secure.</li>
        </ul>
        <h3>What is personal data?</h3>
        <p>Personal data is any information that can identify a living individual, either on its own or in combination with other information. It includes opinions about someone and intentions toward them. It does not include anonymised data.</p>
        <h3>Special category data</h3>
        <p>Some types of data require extra care. These include information about:</p>
        <ul>
          <li>Racial or ethnic origin.</li>
          <li>Political opinions.</li>
          <li>Religious or philosophical beliefs.</li>
          <li>Trade union membership.</li>
          <li>Genetic or biometric data.</li>
          <li>Health.</li>
          <li>Sex life or sexual orientation.</li>
          <li>Criminal convictions or offences.</li>
        </ul>
        <p>We will only process special category data where we have a lawful basis to do so, as detailed in your privacy notice.</p>
        <h3>How we use your data</h3>
        <p>We process personal data to:</p>
        <ul>
          <li>Perform your contract of employment.</li>
          <li>Comply with legal obligations.</li>
          <li>Pursue our legitimate business interests, where these are not overridden by your rights.</li>
        </ul>
        <p>We will not use your data for unrelated purposes without telling you. We do not carry out automated decision making or profiling in relation to employees.</p>
        <h3>Who we share data with</h3>
        <p>We may share your data with trusted third-party service providers who assist us in running the business, including our payroll provider, accountant, and outsourced HR provider. All such parties are required to handle your data securely and only for the purpose for which it was shared. We do not transfer personal data outside the UK or European Economic Area without appropriate safeguards in place. If this changes, we will inform you.</p>
        <h3>Your responsibilities</h3>
        <p>Everyone who works for us shares responsibility for handling personal data correctly. You must:</p>
        <ul>
          <li>Only access personal data you need for your work, and only if authorised to do so.</li>
          <li>Never share personal data informally or with unauthorised people.</li>
          <li>Keep personal data secure at all times.</li>
          <li>Use strong passwords and lock your screen when away from your desk.</li>
          <li>Not save personal data to personal devices.</li>
          <li>Store paper records securely and shred them when no longer needed.</li>
          <li>Report any suspected data breach to the Chair &amp;amp; CEO immediately.</li>
          <li>Not remove or transfer personal data outside of authorised company systems without prior approval.</li>
        </ul>
        <p>A deliberate or negligent breach of this policy may result in disciplinary action, including dismissal. Concealing or destroying data that is subject to a Subject Access Request is a criminal offence and gross misconduct.</p>
        <h3>Data breaches</h3>
        <p>If you become aware of a data breach, report it to the Chair &amp;amp; CEO immediately and preserve any evidence. If a breach is likely to affect the rights and freedoms of individuals, we are legally required to notify the Information Commissioner's Office (ICO) within 72 hours.</p>
        <h3>Your rights as a data subject</h3>
        <p>You have the right to:</p>
        <ul>
          <li>Be informed about how your data is used.</li>
          <li>Access your personal data via a Subject Access Request (SAR).</li>
          <li>Have inaccurate data corrected.</li>
          <li>Request deletion of data we are no longer entitled to hold.</li>
          <li>Restrict processing while accuracy or lawfulness is contested.</li>
          <li>Object to processing based on legitimate interests.</li>
          <li>Object to processing for direct marketing.</li>
          <li>Receive your data in a portable format.</li>
          <li>Not be subject to solely automated decisions.</li>
          <li>Be notified of a security breach affecting your data.</li>
        </ul>
        <p>To exercise any of these rights, contact the Chair &amp;amp; CEO in writing. We will respond within one month (or up to three months for complex requests). SARs are free, unless manifestly unfounded or excessive, in which case we may charge a reasonable fee.</p>
        <p>You also have the right to complain to the ICO at <a href=&quot;https://www.ico.org.uk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>www.ico.org.uk</a>.</p>
      </div>
    </div>

    <!-- 13. PERSONNEL RECORDS -->
    <div class=&quot;sec-card&quot; id=&quot;s13&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>13</span> Personnel Records</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Relevant information about your employment, including records from appraisals, individual meetings and training and development, is held securely on SharePoint.</p>
        <p>You have the right to know what data is held about you and may request a copy of your file. Requests should be made in writing to your line manager, who will make a formal request to the Chair &amp;amp; CEO. If you are a line manager, or if your request relates to your line manager, please submit your request directly to the Chair &amp;amp; CEO. Please allow 10 working days for the information to be provided. There is no charge for this service.</p>
        <p>Data relating to employees must not be shared, verbally or in writing, with anyone who does not have the right to access it.</p>
      </div>
    </div>

    <!-- 14. DEDUCTIONS FROM WAGES -->
    <div class=&quot;sec-card&quot; id=&quot;s14&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>14</span> Deductions from Wages</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We will only deduct money from your pay where required by law or where you have agreed to it. Deductions may be made in the following circumstances:</p>
        <ul>
          <li>Overpayment of wages, bonus, commission, or expenses.</li>
          <li>Holiday taken in excess of your accrued entitlement at the end of employment.</li>
          <li>Loss, damage, or unauthorised use of company or client property caused by your negligence, wilful default, or dishonesty.</li>
          <li>Outstanding loans.</li>
          <li>Unreturned company property at the end of employment.</li>
          <li>Training costs (subject to the training repayment clause).</li>
          <li>Sick pay where reporting requirements were not followed.</li>
          <li>Pay reduction for lateness.</li>
          <li>Cash or stock shortages.</li>
        </ul>
        <p>Any deduction is a genuine reflection of our loss, not a penalty. If you believe you have been overpaid, you must notify the Chair &amp;amp; CEO immediately. Failure to do so may result in disciplinary action.</p>
        <p>If your final pay is insufficient to cover any outstanding debt, you agree to repay the balance within one calendar month of your employment ending.</p>
      </div>
    </div>

    <!-- 15. DIGNITY AT WORK -->
    <div class=&quot;sec-card&quot; id=&quot;s15&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>15</span> Dignity at Work</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Everyone has the right to work in an environment of mutual respect. We will not tolerate harassment or bullying of any kind.</p>
        <h3>What is harassment?</h3>
        <p>Harassment is any unwanted behaviour that affects a person's dignity or creates a hostile, intimidating, or offensive environment. It can occur because of:</p>
        <ul>
          <li>Race, nationality, or ethnic origin.</li>
          <li>Sex or sexual orientation.</li>
          <li>Religion or political beliefs.</li>
          <li>Disability or neurodivergence.</li>
          <li>Age.</li>
          <li>Gender reassignment.</li>
          <li>Trade union membership.</li>
          <li>Any other protected characteristic under the Equality Act 2010.</li>
        </ul>
        <p>Forms of harassment include physical contact, verbal abuse, written messages, online behaviour, social exclusion, and bullying.</p>
        <h3>What to do if you are being harassed</h3>
        <p>If you feel comfortable doing so, tell the person that their behaviour is unwelcome and must stop. If you do not feel safe doing this, or if the behaviour continues, report it to the Chair &amp;amp; CEO immediately.</p>
        <p>Keep a written record of incidents, including dates, times, locations, and what happened. Make notes as soon as possible after each incident.</p>
        <p>All complaints will be dealt with promptly, seriously, and in confidence. There will be no victimisation of anyone who raises a genuine concern.</p>
      </div>
    </div>

    <!-- 16. DRESS CODE -->
    <div class=&quot;sec-card&quot; id=&quot;s16&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>16</span> Dress Code</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Please maintain a clean, professional appearance at all times. When working from home this applies on all video calls and when attending client meetings, away days, or any work-related event. If you are unsure what is appropriate for a specific occasion, please ask your line manager or the Chair &amp;amp; CEO.</p>
        <p>SDI provides a uniform for use at company events. If you have been issued a uniform, please keep it clean and presentable. If it becomes worn or needs replacing, speak to your line manager.</p>
        <p>This applies equally to video calls and online meetings. A professional appearance is expected whenever you are visible to colleagues or customers, including on Teams video.</p>
      </div>
    </div>

    <!-- 17. EQUALITY AND DIVERSITY -->
    <div class=&quot;sec-card&quot; id=&quot;s17&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>17</span> Equality and Diversity</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We are an equal opportunities employer. We believe that decisions about people at work should be based on ability, skills, performance, and behaviour, not on personal characteristics.</p>
        <p>We comply with the Equality Act 2010, which prohibits discrimination on the grounds of:</p>
        <ul>
          <li>Age.</li>
          <li>Disability.</li>
          <li>Gender reassignment.</li>
          <li>Marriage and civil partnership.</li>
          <li>Pregnancy and maternity.</li>
          <li>Race (including colour, nationality, and ethnic or national origin).</li>
          <li>Religion or belief.</li>
          <li>Sex.</li>
          <li>Sexual orientation.</li>
        </ul>
        <p>Any discrimination, abuse, or harassment will lead to disciplinary action. Serious cases may result in dismissal and referral to the police.</p>
        <h3>Transgender employees</h3>
        <p>If you intend to transition or have already done so, please speak to us so we can discuss any adjustments or support you need. We will update your records on request, though some records (such as payroll) may require a legal name change.</p>
        <h3>Names and pronouns</h3>
        <p>We will address you by the name and pronoun of your choice.</p>
        <h3>Religious or cultural observance</h3>
        <p>If you need support at work to participate in religious or cultural practices, please speak to your line manager.</p>
        <h3>Complaints</h3>
        <p>If you believe you have been discriminated against or harassed, raise it with the Chair &amp;amp; CEO immediately. Our formal grievance procedure is also available. We handle all concerns sympathetically and aim for a fair resolution.</p>
      </div>
    </div>

    <!-- 18. EXPENSES -->
    <div class=&quot;sec-card&quot; id=&quot;s18&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>18</span> Expenses</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company will reimburse reasonable and necessary expenses incurred on company business, provided you submit supporting receipts or invoices by the monthly deadline. Reimbursement is paid through payroll.</p>
        <h3>Travel</h3>
        <p>Please use the most cost-effective mode of transport available. If travelling by car, you will be reimbursed at the approved mileage rate of 35p per mile.</p>
        <h3>Taxis</h3>
        <p>Taxis should only be used when carrying equipment, working late at night, or when they are the safest option. Tips are not reimbursable.</p>
        <h3>Alcohol with meals</h3>
        <p>One drink may be claimed with a meal when away on business. Please refer to the Alcohol, Drugs and Smoking policy for the company's full position on alcohol at work events. Alcohol is not permitted if you are driving a hired vehicle. Doing so will be treated as gross misconduct and may result in dismissal.</p>
        <h3>Relocation</h3>
        <p>If the company asks you to relocate to another office, we will consider reimbursing reasonable relocation costs. If you leave within two years of receiving relocation assistance, we reserve the right to reclaim all or part of that support.</p>
        <h3>Fraudulent claims</h3>
        <p>Submitting false or fabricated expense claims is gross misconduct and will result in dismissal.</p>
      </div>
    </div>

    <!-- 19. FLEXIBILITY -->
    <div class=&quot;sec-card&quot; id=&quot;s19&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>19</span> Flexibility</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Your job description sets out your core responsibilities. Because we are a small team, we sometimes need everyone to be flexible. From time to time, we may ask you to take on different tasks to help the team meet client needs. We will never ask you to do something you are not capable of, or anything that would put your health and safety at risk.</p>
      </div>
    </div>

    <!-- 20. FLEXIBLE WORKING -->
    <div class=&quot;sec-card&quot; id=&quot;s20&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>20</span> Flexible Working</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We recognise that flexibility in working arrangements is important to many people. This policy sets out how we handle statutory flexible working requests.</p>
        <h3>Making a request</h3>
        <p>All employees may make up to two flexible working requests in any 12-month period. You must wait until any previous request (including any appeal) has been fully resolved before submitting another.</p>
        <p>Your request must be in writing and must include:</p>
        <ul>
          <li>The change you are requesting and when you would like it to take effect.</li>
          <li>A statement confirming this is a statutory request.</li>
          <li>Details of any previous flexible working request and when it was made.</li>
        </ul>
        <p>Types of change you may request include reduced or compressed hours, working from home, different start and finish times, different working days, or a job share arrangement.</p>
        <h3>What happens next</h3>
        <p>Your line manager will meet with you as soon as reasonably possible. The full process, including any appeal, will normally be completed within two months of your request, unless you both agree to extend this.</p>
        <p>At the meeting, we will assess how the proposed arrangement could work in practice, discuss the impact on the team and business, and explore any alternatives that might suit both parties.</p>
        <h3>Approval and contract changes</h3>
        <p>If your request is approved, the change will be made on a trial or fixed term basis initially. A permanent change to your contract of employment will only be made following a formal review and written agreement from both parties. Any such change will be confirmed in writing.</p>
        <p>Each request is considered individually. Approving one person's request does not set a precedent for other employees.</p>
        <h3>Rejection</h3>
        <p>A request may be refused for legitimate business reasons, including:</p>
        <ul>
          <li>Additional cost burden.</li>
          <li>Inability to reorganise work among existing staff.</li>
          <li>Inability to recruit suitable cover.</li>
          <li>Detrimental impact on quality or performance.</li>
          <li>Inability to meet customer demand.</li>
          <li>Insufficient work during the proposed hours.</li>
          <li>A planned structural change to the business.</li>
        </ul>
        <p>If your request is refused, we will write to you explaining the business reasons and setting out your right to appeal.</p>
      </div>
    </div>

    <!-- 21. HEALTH AND SAFETY -->
    <div class=&quot;sec-card&quot; id=&quot;s21&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>21</span> Health and Safety</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company is committed to providing a safe and healthy working environment. As an employee, you also have a legal duty to take reasonable care of yourself and anyone else who may be affected by your actions at work.</p>
        <p>Please read the company's Health and Safety Policy document, which sets out our full procedures. The overall responsibility for health and safety rests with the Chair &amp;amp; CEO.</p>
      </div>
    </div>

    <!-- 22. HOLIDAYS -->
    <div class=&quot;sec-card&quot; id=&quot;s22&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>22</span> Holidays</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company's holiday year runs from 1 January to 31 December.</p>
        <table class=&quot;tbl ctrl-tbl&quot;>
          <tr><td class=&quot;k&quot;>Annual leave</td><td>38 days paid holiday per year (inclusive of the 8 statutory bank holidays). Pro rata for part-time employees.</td></tr>
        </table>
        <p>Key rules:</p>
        <ul>
          <li>All holidays must be taken within the holiday year in which it accrues. Carrying over unused holiday is not permitted unless you were unable to take it due to long term sickness.</li>
          <li>Do not make firm travel bookings until your holiday has been approved in writing. The company is not liable for any costs you incur from booking before approval.</li>
          <li>If you are getting married or entering a civil partnership, you may take an additional day's holiday on or before your wedding day.</li>
          <li>Bookings are capped at 10 working days in any one request.</li>
          <li>We may require you to take holiday on specific dates, including during any notice period. We will give you as much notice as reasonably possible.</li>
        </ul>
        <p>Please give your line manager written notice of your holiday dates based on the following minimum notice periods:</p>
        <table class=&quot;tbl&quot;>
          <thead><tr><th>Holiday requested</th><th>Minimum notice required</th></tr></thead>
          <tbody>
            <tr><td>1 day</td><td>2 days</td></tr>
            <tr><td>2 days</td><td>4 days</td></tr>
            <tr><td>3 days</td><td>6 days</td></tr>
            <tr><td>4 days</td><td>8 days</td></tr>
            <tr><td>5 days</td><td>10 days</td></tr>
            <tr><td>6 days</td><td>12 days</td></tr>
            <tr><td>7 days</td><td>14 days</td></tr>
            <tr><td>8 days</td><td>16 days</td></tr>
            <tr><td>9 days</td><td>18 days</td></tr>
            <tr><td>10 days</td><td>20 days</td></tr>
          </tbody>
        </table>
        <p>If your employment ends and you have taken more holiday than you have accrued in that year, we will deduct the equivalent pay from your final salary. If you have unused accrued statutory holiday, this will be paid on leaving.</p>
        <p>If you fall ill during a prebooked holiday, we may at our discretion reimburse the affected days as annual leave and pay SSP instead, provided you follow the sickness absence reporting procedure and your illness is properly certified.</p>
      </div>
    </div>

    <!-- 23. INDUCTION -->
    <div class=&quot;sec-card&quot; id=&quot;s23&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>23</span> Induction</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We believe our people are our greatest asset. Your induction programme begins on your first day and will be tailored to your role. It will be spread across your first few months and is designed to help you settle in, build your knowledge, and start contributing with confidence.</p>
      </div>
    </div>
    <!-- 24. IT AND SOCIAL MEDIA -->
    <div class=&quot;sec-card&quot; id=&quot;s24&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>24</span> IT and Social Media</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Company IT systems, including computers, email, internet access, and communication platforms, are provided for business use. Personal use should be kept to a minimum and must not interfere with your work or bring the company into disrepute.</p>
        <h3>Ownership</h3>
        <p>All company communication platforms and correspondence created using company systems are the property of the company. We reserve the right to monitor, intercept, and access communications for lawful purposes, including preventing crime, detecting unauthorised use, and checking compliance with our policies.</p>
        <p>The lawful basis for this monitoring is the company's legitimate interests in protecting its business, data, and clients, and in ensuring compliance with its policies. This interest has been balanced against employee privacy rights and is considered proportionate. Employees are informed of this monitoring through this handbook. Monitoring will not be used as a means of intrusive surveillance and will only be carried out where there is a legitimate reason to do so.</p>
        <h3>Prohibited use</h3>
        <p>You must not use company IT systems or internet access to:</p>
        <ul>
          <li>View, download, or share illegal, offensive, discriminatory, or sexually explicit content.</li>
          <li>Send abusive, harassing, or defamatory messages to any person.</li>
          <li>Gamble online or conduct activities unrelated to work.</li>
          <li>Install unauthorised software or applications.</li>
          <li>Upload data or images belonging to others without their permission.</li>
          <li>Access social media for personal use (work accounts only, where approved).</li>
        </ul>
        <h3>Network and data security</h3>
        <p>Do not copy programs or files onto company systems without authorisation from the Chair &amp;amp; CEO. All files from external sources must be virus checked before use. If you access company systems remotely via VPN or cloud-based platforms, do not download or transfer data to personal devices without prior consent from the Chair &amp;amp; CEO.</p>
        <h3>Social media guidelines</h3>
        <p>We encourage you to share your enthusiasm for your work online, but please follow these guidelines:</p>
        <ul>
          <li>Seek approval from the Chief Experience Officer (CXO) before creating any SDI related work account on any social media platform.</li>
          <li>Keep your personal and work accounts completely separate.</li>
          <li>If you comment on work related matters, disclose that you work for SDI.</li>
          <li>Make clear that your personal views are your own, not SDI's.</li>
          <li>Never share financial data, client information, business strategies, or anything confidential.</li>
          <li>Never post anything that could embarrass the company, a colleague, or a client.</li>
          <li>Respect copyright: never post someone else's content without their permission.</li>
          <li>Never impersonate a senior leader or the Chair &amp;amp; CEO.</li>
          <li>All SDI work account credentials must be held by SDI and shared with the Chair &amp;amp; CEO.</li>
        </ul>
        <p>Breaching this policy may result in disciplinary action, up to and including dismissal. If you are unsure about a post, speak to your line manager or the CXO before publishing.</p>
      </div>
    </div>

    <!-- 25. MATERNITY, PATERNITY, ADOPTION AND SHARED PARENTAL LEAVE -->
    <div class=&quot;sec-card&quot; id=&quot;s25&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>25</span> Maternity, Paternity, Adoption and Shared Parental Leave</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company complies with all current legislation on maternity, paternity, adoption, and shared parental leave and pay. As these rights are subject to change, please speak to your line manager for a copy of the current policy for each type of leave.</p>
      </div>
    </div>

    <!-- 26. MENOPAUSE -->
    <div class=&quot;sec-card&quot; id=&quot;s26&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>26</span> Menopause</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We want to support all employees through significant life events, including the menopause. This policy should be read alongside our flexible working, sickness absence, and other relevant policies.</p>
        <p>We recognise that menopause can affect trans men, non-binary people, and others who do not identify as women. This policy applies equally to all employees who experience menopause, regardless of gender identity. All support, adjustments, and conversations will be handled with the same sensitivity and confidentiality.</p>
        <p>The menopause is a natural biological process, typically occurring around the age of 51, though it can happen earlier due to medical treatment or illness. There are three stages:</p>
        <ul>
          <li><strong>Perimenopause:</strong> the years leading up to the menopause, during which symptoms may first appear.</li>
          <li><strong>Menopause:</strong> typically confirmed after 12 consecutive months without a period.</li>
          <li><strong>Post menopause:</strong> the period following this.</li>
        </ul>
        <p>Symptoms vary widely but can include hot flushes, night sweats, headaches, fatigue, joint pain, palpitations, anxiety, low mood, difficulty concentrating, and sleep disruption.</p>
        <h3>Support and adjustments</h3>
        <p>We encourage anyone experiencing difficulties to speak to their line manager. Reasonable adjustments we can consider include:</p>
        <ul>
          <li>Time off for GP or specialist appointments, including menopause clinics.</li>
          <li>Flexibility around start and finish times where fatigue or sleep disruption is a factor.</li>
          <li>Adjustments to duties or hours where concentration is affected.</li>
          <li>An additional set of event uniform where attendance at company events is required.</li>
          <li>Regular check ins for additional support.</li>
        </ul>
        <p>All conversations will be treated with sensitivity and in confidence.</p>
        <h3>Age related hormonal decline in men</h3>
        <p>Some men experience a gradual decline in testosterone levels with age, typically from their 40s or 50s onwards. This is sometimes referred to as the male menopause, andropause, or late onset hypogonadism. Unlike female menopause, this tends to occur gradually rather than suddenly.</p>
        <p>Symptoms may include fatigue, low mood, reduced concentration, changes in sleep, reduced libido, and physical changes. Where these symptoms have a substantial and long-term effect on day-to-day activities, they may constitute a disability under the Equality Act 2010, in which case the company's duty to make reasonable adjustments will apply.</p>
        <p>The company encourages any employee experiencing these symptoms to speak to their line manager or the Chair &amp;amp; CEO in confidence. The same support, flexibility, and reasonable adjustments available under this policy apply equally. All conversations will be handled with sensitivity and without judgement.</p>
      </div>
    </div>

    <!-- 27. MOBILE PHONES -->
    <div class=&quot;sec-card&quot; id=&quot;s27&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>27</span> Mobile Phones</h2></div>
      <div class=&quot;sec-body&quot;>
        <h3>Personal mobile phones</h3>
        <p>Personal mobile phones may be used freely during breaks but should not be used for personal calls or activity during working hours in a way that disrupts your work or availability. If you are on a Teams call or dealing with a customer, please ensure personal calls and notifications do not cause interruptions.</p>
        <h3>Company mobile phones</h3>
        <p>A company mobile phone is issued for business use. Personal use should be kept to a minimum. We reserve the right to monitor usage and may deduct the cost of excessive personal calls from your wages or reclaim the phone.</p>
        <p>Additional rules for company phones:</p>
        <ul>
          <li>Do not call premium rate numbers.</li>
          <li>Do not take or send photos or videos while on duty without your line manager's authorisation and the consent of anyone being photographed.</li>
          <li>Do not access social media unless posting on an approved company account.</li>
          <li>Do not download apps that have not been authorised by your line manager.</li>
          <li>Apply a strong screen lock and keep the device secure at all times.</li>
          <li>Report a lost or stolen phone to your manager immediately.</li>
        </ul>
        <p>If a phone is lost through your carelessness, you may be required to pay the full cost of replacement.</p>
      </div>
    </div>

    <!-- 28. PERFORMANCE REVIEWS -->
    <div class=&quot;sec-card&quot; id=&quot;s28&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>28</span> Performance Reviews</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We invest in our people and are committed to supporting everyone's development and growth.</p>
        <p>Your performance and progression may be reviewed through a Job Development Review conducted by your line manager and then the Chair &amp;amp; CEO. This is a structured, two-way discussion designed to reflect on achievements, discuss opportunities for growth, and agree objectives and a Personal Development Plan for the year ahead.</p>
        <p>Any relevant documentation will be provided in advance to allow you to prepare fully and make the most of the meeting.</p>
      </div>
    </div>

    <!-- 29. RECEIPT OF GIFTS -->
    <div class=&quot;sec-card&quot; id=&quot;s29&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>29</span> Receipt of Gifts</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Your work may bring you into contact with clients, suppliers, or partners who offer gifts or hospitality. You should not accept any gift or benefit that could influence, or appear to influence, your professional judgement. In particular:</p>
        <ul>
          <li>Do not accept cash or cash equivalents under any circumstances.</li>
          <li>Minor, token gifts in line with normal business practice are acceptable.</li>
          <li>When in doubt, always ask your line manager or the Chair &amp;amp; CEO before accepting.</li>
        </ul>
        <p>The same applies to gifts offered to members of your immediate family in connection with your role.</p>
      </div>
    </div>

    <!-- 30. RESOLVING PROBLEMS -->
    <div class=&quot;sec-card&quot; id=&quot;s30&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>30</span> Resolving Problems</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We believe clear, fair, and open procedures for resolving problems are essential for everyone. We encourage people to raise concerns early and informally wherever possible.</p>
        <h3>Grievance Procedure</h3>
        <h4>Stage 1 &amp;ndash; Informal</h4>
        <p>Raise the issue with the relevant person directly and promptly. Many concerns can be resolved quickly through a straightforward conversation.</p>
        <h4>Stage 2 &amp;ndash; Formal</h4>
        <p>If informal resolution fails or the matter is serious, set out your complaint in writing to your line manager, including as much detail as possible. We will invite you to a meeting to discuss the issue and how it can be resolved. A second meeting may be needed.</p>
        <p>We will write to you with the outcome and remind you of your right to appeal. The appeal decision is final. Where the grievance involves your line manager, another manager, director, or independent consultant will handle the investigation.</p>
        <p>If your line manager is the subject of your grievance, please submit your complaint directly to the Chair &amp;amp; CEO, who will arrange for it to be handled independently.</p>
        <p>If your employment has ended and you wish to raise a grievance, write to your line manager setting out your complaint.</p>
        <h3>Right to be accompanied</h3>
        <p>You may bring a work colleague or a certified trade union official to any disciplinary or grievance hearing. Your companion may speak on your behalf and respond to points raised but may not answer questions put directly to you. If they cannot attend on the scheduled date, we will postpone for up to five working days.</p>
        <h3>Investigations and Suspension</h3>
        <p>Where necessary, we will carry out an investigation before taking any disciplinary action. We may appoint an independent consultant for impartiality. We may also suspend you on full basic pay during an investigation. Suspension is not a disciplinary sanction and does not imply guilt.</p>
        <h3>Disciplinary Procedure</h3>
        <p>This procedure is designed to help you meet the standards we expect and to deal fairly with situations where conduct or performance falls short.</p>
        <p>Before any disciplinary action is taken, you will always be:</p>
        <ul>
          <li>Given a full opportunity to respond to any allegation.</li>
          <li>Told what action is being considered and what the consequences could be.</li>
          <li>Advised of any improvement required and the timescale for it.</li>
          <li>Entitled to be accompanied as described above.</li>
        </ul>
        <p>Disciplinary hearings are normally conducted by the Chair &amp;amp; CEO.</p>
        <p>Where the Chair &amp;amp; CEO has a direct involvement in the matter, an independent consultant will be appointed to conduct the hearing to ensure a fair and impartial process.</p>
        <h4>Stage 1 &amp;ndash; Informal counselling</h4>
        <p>For minor concerns, your manager will speak with you informally to help you understand what needs to improve.</p>
        <h4>Stage 2 &amp;ndash; Verbal warning</h4>
        <p>Where informal counselling has not resolved the issue, or for more serious matters, a verbal warning will be issued. This will be confirmed in writing and remain on your file for up to six months.</p>
        <h4>Stage 3 &amp;ndash; Written warning</h4>
        <p>For more serious matters, or where a verbal warning has not led to improvement, a written warning will be issued. It will set out the required standards, any timescale for improvement, and the consequences of further misconduct. It will remain on file for up to 12 months.</p>
        <h4>Stage 4 &amp;ndash; Final written warning</h4>
        <p>Where the problem has not been resolved, or for a serious matter, a final written warning will be issued. This will make clear that dismissal will follow if there is further misconduct or failure to improve. It will remain on file for up to 12 months.</p>
        <h4>Stage 5 &amp;ndash; Dismissal or other serious action</h4>
        <p>Where all previous stages have been exhausted, or in cases of gross misconduct, you may be dismissed. In some cases, we may instead apply a demotion, disciplinary transfer, or unpaid suspension. Dismissal for gross misconduct will normally be without notice or pay in lieu of notice.</p>
        <p>Depending on the circumstances, we may omit or accelerate stages of this procedure.</p>
        <h3>Misconduct (examples)</h3>
        <ul>
          <li>Poor timekeeping.</li>
          <li>Unreasonable or unauthorised absence.</li>
          <li>Failure to meet performance standards.</li>
          <li>Failure to follow company procedures.</li>
          <li>Minor health and safety breaches.</li>
          <li>Improper use of company property.</li>
        </ul>
        <h3>Gross Misconduct (examples)</h3>
        <p>The following are examples of behaviour that may result in immediate dismissal:</p>
        <ul>
          <li>Theft, fraud, or bribery.</li>
          <li>Falsification of records.</li>
          <li>Breach of confidentiality.</li>
          <li>Physical assault or fighting.</li>
          <li>Insubordination or refusal to follow a reasonable instruction.</li>
          <li>Serious or deliberate damage to company or client property.</li>
          <li>Serious health and safety breaches.</li>
          <li>Bringing yourself or the company into disrepute.</li>
          <li>Bullying, victimisation, or harassment (in person, online, or via any other channel).</li>
          <li>Attending work under the influence of alcohol or drugs.</li>
          <li>Possession or use of illegal drugs during working hours or at any work-related event.</li>
          <li>Verbal abuse or threats of violence.</li>
          <li>Unauthorised or covert recording of meetings.</li>
          <li>Serious breaches of our data protection or IT policies.</li>
        </ul>
        <p>These are examples only. Behaviour of a similar nature may also be treated as gross misconduct.</p>
        <h3>Bullying and Harassment</h3>
        <p>We have zero tolerance for bullying and harassment. Any employee who believes they are being subjected to or has witnessed such behaviour must inform their line manager.</p>
        <p>Where possible, ask the person to stop directly or with support from a colleague. If this is not appropriate or does not work, raise a formal complaint with your line manager. The complaint will be treated seriously, investigated confidentially, and dealt with under the disciplinary procedure. There will be no victimisation of anyone who raises a genuine concern in good faith.</p>
        <h3>Appeals</h3>
        <p>You have the right to appeal any disciplinary decision. Submit your appeal in writing within five working days of the decision, stating your reasons. You will receive a response within a further five working days. The outcome of the appeal is final.</p>
        <h3>Performance Management</h3>
        <p>Where performance falls short of what your role requires, we will work with you openly and constructively to address it. Your manager will first raise concerns informally, then move to a formal improvement plan if needed. The plan will set clear expectations, a review period, and the support we will provide.</p>
        <p>If performance does not improve sufficiently, we may consider a move to a more suitable role or, as a last resort, dismissal. You have the right to appeal a dismissal for performance reasons using the same process described above.</p>
      </div>
    </div>

    <!-- 31. RESTRICTIONS AND CONFIDENTIALITY -->
    <div class=&quot;sec-card&quot; id=&quot;s31&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>31</span> Restrictions and Confidentiality</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The following restrictions apply during and after your employment:</p>
        <ul>
          <li>You must not undertake paid work for any other employer or carry out public or charitable duties during working hours, without the company's prior written consent.</li>
          <li>You must not carry out any activity outside work that could impair your ability to perform your role. Raise any doubt with the Chair &amp;amp; CEO.</li>
          <li>You must not disclose or use any confidential information about the company, its clients, or its business that is not already in the public domain. This includes trade secrets, financial information, client details, and anything else acquired in the course of your employment. This obligation continues after your employment ends.</li>
        </ul>
        <p>Nothing in this section prevents you from making a protected disclosure under the Public Interest Disclosure Act 1998. Confidentiality obligations do not apply to any disclosure that is legally protected as whistleblowing. Please refer to the Whistleblowing section of this handbook.</p>
      </div>
    </div>

    <!-- 32. RETURNING DOCUMENTS AND EQUIPMENT -->
    <div class=&quot;sec-card&quot; id=&quot;s32&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>32</span> Returning Documents and Equipment</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>On leaving the company, you must return all keys, uniforms, equipment, and any other company property immediately. You may not retain copies of any company documents or materials. The cost of any items that are not returned or are returned in a damaged condition may be deducted from your final pay.</p>
      </div>
    </div>

    <!-- 33. SECURITY -->
    <div class=&quot;sec-card&quot; id=&quot;s33&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>33</span> Security</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company may carry out Disclosure and Barring Service (DBS) checks as part of your employment. If a check reveals an undisclosed criminal record that is not spent under the Rehabilitation of Offenders Act, you may face disciplinary action.</p>
        <p>You will be informed at the point of offer, or during your employment, if your role requires a DBS check. Not all roles are subject to this requirement.</p>
        <p>We reserve the right to search employees and their belongings at staff meetings, away days, client visits, or any other work-related event or venue, where there is reasonable cause to do so.</p>
      </div>
    </div>

    <!-- 34. SERVICE DISRUPTION -->
    <div class=&quot;sec-card&quot; id=&quot;s34&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>34</span> Service Disruption</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>As a remote-first company, our ability to work depends on home internet connections, power supply, and equipment rather than travel to an office. If you experience a disruption that prevents you from working, please follow the steps below.</p>
        <p>Contact your line manager as soon as possible at the start of your working day to explain the situation and give an estimated return to availability. Update your Teams status to reflect that you are temporarily unavailable.</p>
        <p>If the disruption is short-term, for example a brief power or internet outage, please make every effort to restore connectivity and resume work as quickly as possible. Options your manager may agree include:</p>
        <ul>
          <li>Making up the time later in the day or on another day.</li>
          <li>Using annual leave if the disruption is prolonged.</li>
          <li>Taking unpaid leave where appropriate.</li>
        </ul>
        <p>Where a disruption is caused by a third-party failure outside your control, such as a prolonged regional outage, the company will take a reasonable and supportive approach. If you are unable to work for reasons genuinely beyond your control, you will not be penalised, and we will agree a suitable arrangement with you.</p>
        <p>If you are required to travel for business and face severe weather or travel disruption, contact your line manager immediately. Your safety is the priority, and no business trip is worth putting yourself at risk.</p>
      </div>
    </div>

    <!-- 35. SEXUAL HARASSMENT -->
    <div class=&quot;sec-card&quot; id=&quot;s35&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>35</span> Sexual Harassment</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Sexual harassment is unwanted behaviour of a sexual nature. We take all reports seriously and have zero tolerance for this behaviour.</p>
        <p>All employees are responsible for ensuring that sexual harassment does not occur in our workplace or at work related events. If you experience or witness sexual harassment, report it to your manager promptly. Any employee who has suffered sexual harassment will be given paid time off for any physical or mental health support needed.</p>
        <p>All complaints will be investigated confidentially by either a nominated manager or an independent consultant. Where appropriate, the alleged perpetrator may be suspended on full pay during the investigation. If harassment is proven, the disciplinary procedure will apply. There will be no victimisation of anyone raising a genuine complaint.</p>
      </div>
    </div>

    <!-- 36. TIMEKEEPING AND AVAILABILITY -->
    <div class=&quot;sec-card&quot; id=&quot;s36&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>36</span> Timekeeping and Availability</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Arriving late for work creates extra pressure on your colleagues and is not acceptable. We understand that occasional lateness happens for genuine reasons, but persistent late arrival or unauthorised absence will be treated as a disciplinary matter.</p>
        <p>Where lateness is occasional and there is a reasonable explanation, your line manager will raise it informally and agree a way forward with you. Where lateness is persistent or unexplained, it will be addressed under the disciplinary procedure.</p>
      </div>
    </div>

    <!-- 37. TRAINING -->
    <div class=&quot;sec-card&quot; id=&quot;s37&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>37</span> Training</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>We support your development and may contribute to or fully fund training that is directly relevant to your role. All training requests must be approved by your line manager or the Chair &amp;amp; CEO.</p>
        <p>If you leave the company within two years of the company paying for your training, you may be required to repay a proportion of the cost:</p>
        <table class=&quot;tbl&quot;>
          <thead><tr><th>Time since training paid</th><th>Amount to repay</th></tr></thead>
          <tbody>
            <tr><td>Up to 6 months</td><td>Repay 100%</td></tr>
            <tr><td>6 to 12 months</td><td>Repay 75%</td></tr>
            <tr><td>12 to 18 months</td><td>Repay 50%</td></tr>
            <tr><td>18 to 24 months</td><td>Repay 25%</td></tr>
            <tr><td>Over 24 months</td><td>No repayment</td></tr>
          </tbody>
        </table>
        <p>Any repayment owed at the point of leaving may be deducted from your final pay.</p>
        <p>If your final pay is insufficient to cover the amount owed, or if you have already left the company, we will invoice you for the outstanding balance, which must be settled within 30 days of the invoice date.</p>
      </div>
    </div>

    <!-- 38. WORKING HOURS -->
    <div class=&quot;sec-card&quot; id=&quot;s38&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>38</span> Working Hours</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>SDI operates a flexible working hours arrangement. Rather than fixed start and finish times, you may begin work at any time between 8am and 10am, working your contracted hours from that point.</p>
        <p>Standard daily hours are as follows:</p>
        <ul>
          <li>Monday to Thursday: 8 hours from your chosen start time.</li>
          <li>Friday: 7 hours from your chosen start time.</li>
          <li>Total working week: 34 hours. You must not exceed this or intentionally accrue additional hours.</li>
        </ul>
        <p>This arrangement is not intended to lock in a permanent daily start or finish time. It is intended to give you flexibility to manage your day around your tasks, objectives, and priorities. On some days, business requirements may mean a specific start time is necessary. Please be flexible when this is the case.</p>
        <p>Please keep your Teams status message up to date so colleagues know when you are working and available. If your hours on a given day differ from your usual pattern, update your status in advance so your team can plan around you.</p>
        <h3>Right to disconnect</h3>
        <p>The company respects your right to disconnect from work outside of your contracted working hours. You are not expected to read, respond to, or act on work communications &amp;mdash; including email, Teams messages, or calls &amp;mdash; outside of your agreed working hours, except in genuine emergencies.</p>
        <p>Managers will not routinely contact employees outside of working hours and will not expect responses until the next working day. If contact outside hours is genuinely necessary, the reason will be made clear, and no employee will be penalised for not responding immediately.</p>
        <p>If you feel under pressure to remain available outside your working hours, please raise this with the Chair &amp;amp; CEO.</p>
      </div>
    </div>

    <div class=&quot;part-divider&quot;><span class=&quot;part-divider-bar&quot;></span><span class=&quot;part-divider-text&quot;>Additional policies</span><span class=&quot;part-divider-rule&quot;></span></div>

    <!-- 39. HOME WORKING HEALTH AND SAFETY -->
    <div class=&quot;sec-card&quot; id=&quot;s39&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>39</span> Home Working Health and Safety</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The Health and Safety at Work Act 1974 and the Management of Health and Safety at Work Regulations 1999 apply equally to employees working from home. The company has a legal duty to assess and manage the risks associated with home working, and employees have a corresponding duty to cooperate with that assessment and to take reasonable care of their own health and safety.</p>
        <h3>Display Screen Equipment (DSE)</h3>
        <p>The Health and Safety (Display Screen Equipment) Regulations 1992 apply to all employees who use a computer screen as a significant part of their work. As a fully remote organisation, all SDI employees are covered by these regulations.</p>
        <p>The company will carry out a DSE assessment for each employee. You are required to cooperate with this process and to raise any concerns about your home workstation promptly. The company will provide reasonable support to ensure your workstation meets the required standard. This may include guidance on screen positioning, seating, lighting, and equipment.</p>
        <p>You are entitled to request an eyesight test at the company's expense if you use display screen equipment regularly. Please speak to the Chair &amp;amp; CEO if you wish to arrange this.</p>
        <h3>Home workstation</h3>
        <p>You are responsible for ensuring your home working environment is safe and suitable. This includes adequate lighting, a suitable chair and desk, sufficient ventilation, and freedom from trip hazards. If you have concerns about your working environment that you cannot resolve yourself, please raise them with the Chair &amp;amp; CEO so that appropriate support can be arranged.</p>
        <h3>Mental health and wellbeing</h3>
        <p>The company recognises that working from home can present challenges for mental health and wellbeing, including isolation, difficulty switching off, and blurred boundaries between work and home life. We take these risks seriously. If you are struggling, please speak to your line manager or the Chair &amp;amp; CEO. You will not be judged for raising concerns about your wellbeing.</p>
        <p>The overall responsibility for health and safety rests with the Chair &amp;amp; CEO. The company's full Health and Safety Policy is available on SharePoint.</p>
      </div>
    </div>

    <!-- 40. NOTICE PERIODS -->
    <div class=&quot;sec-card&quot; id=&quot;s40&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>40</span> Notice Periods</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Both the company and employees are required to give notice to terminate employment. The minimum notice periods are set out in your Letter of Engagement or contract of employment.</p>
        <p>Where your contract does not specify a longer period, the statutory minimum notice periods under the Employment Rights Act 1996 apply:</p>
        <ul>
          <li>Employees with less than one month's service: no statutory minimum notice.</li>
          <li>Employees with one month to two years' service: one week's notice.</li>
          <li>Employees with two or more years' service: one week's notice for each complete year of continuous employment, up to a maximum of 12 weeks.</li>
        </ul>
        <p>The company may, at its discretion, offer payment in lieu of notice rather than requiring you to work your notice period. During any notice period, all normal employment obligations continue to apply.</p>
        <p>If you resign without giving the correct notice, or if you leave before your notice period expires, the company reserves the right to recover any losses caused as a result, including the cost of covering your role at short notice.</p>
        <h3>Statutory redundancy pay</h3>
        <p>If your role is made redundant, you may be entitled to a statutory redundancy payment under the Employment Rights Act 1996, provided you have at least two years of continuous service with the company.</p>
        <p>Statutory redundancy pay is calculated as follows:</p>
        <ul>
          <li>Half a week's pay for each full year of service under the age of 22.</li>
          <li>One week's pay for each full year of service between the ages of 22 and 40.</li>
          <li>One and a half week's pay for each full year of service at age 41 or over.</li>
        </ul>
        <p>A week's pay is subject to a statutory maximum, which is updated by the government each April. Service is capped at 20 years for the purpose of this calculation. Redundancy pay is tax free up to &amp;pound;30,000.</p>
        <p>If the company ever needs to consider redundancies, it will follow a fair process, consult with affected employees, consider alternatives, and give appropriate notice. The company will always act in accordance with its legal obligations.</p>
      </div>
    </div>

    <!-- 41. PENSION -->
    <div class=&quot;sec-card&quot; id=&quot;s41&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>41</span> Pension</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company operates a workplace pension scheme in compliance with its auto-enrolment obligations under the Pensions Act 2008. The company's pension provider is Aviva.</p>
        <h3>Auto-enrolment</h3>
        <p>If you meet the qualifying criteria &amp;mdash; broadly, if you are aged between 22 and State Pension age and earn above the earnings trigger &amp;mdash; you will be automatically enrolled into the Aviva workplace pension scheme. You will receive written confirmation of your enrolment and the contribution rates that apply.</p>
        <p>You have the right to opt out of the pension scheme within one month of being enrolled. If you opt out, you will be automatically re-enrolled at the next re-enrolment date, typically every three years. You may opt out again at that point if you wish.</p>
        <h3>Contributions</h3>
        <p>Contribution rates are set in accordance with statutory minimums and will be detailed in your enrolment confirmation. Both the company and you as an employee contribute to your pension. Your contribution is deducted directly from your salary before tax, meaning you receive tax relief on what you pay in.</p>
        <h3>Further information</h3>
        <p>Current contribution rates &amp;mdash; both the company's and your own &amp;mdash; will be confirmed in your enrolment documentation from Aviva. Rates are reviewed periodically and may change in line with statutory requirements. You can view and manage your pension online via your Aviva account. For any queries about the scheme, please speak to the Chair &amp;amp; CEO or visit <a href=&quot;https://www.aviva.co.uk&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>www.aviva.co.uk</a>.</p>
      </div>
    </div>

    <!-- 42. WHISTLEBLOWING -->
    <div class=&quot;sec-card&quot; id=&quot;s42&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>42</span> Whistleblowing</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company is committed to the highest standards of openness, honesty, and accountability. This policy is intended to encourage and enable employees to raise genuine concerns about wrongdoing internally, rather than ignoring them or raising them externally in the first instance.</p>
        <h3>Protected disclosures</h3>
        <p>Under the Public Interest Disclosure Act 1998, employees have the right to make a protected disclosure &amp;mdash; commonly referred to as whistleblowing &amp;mdash; without suffering any detriment as a result. A protected disclosure is a disclosure of information that you reasonably believe, and that is made in the public interest, tends to show one or more of the following:</p>
        <ul>
          <li>A criminal offence has been, is being, or is likely to be committed.</li>
          <li>A person has failed, is failing, or is likely to fail to comply with a legal obligation.</li>
          <li>A miscarriage of justice has occurred, is occurring, or is likely to occur.</li>
          <li>The health or safety of any individual has been, is being, or is likely to be endangered.</li>
          <li>The environment has been, is being, or is likely to be damaged.</li>
          <li>Information tending to show any of the above has been, is being, or is likely to be deliberately concealed.</li>
        </ul>
        <h3>How to raise a concern</h3>
        <p>If you have a genuine concern about any of the above, please raise it with the Chair &amp;amp; CEO as soon as possible. You should set out your concern in writing where possible, including the facts as you understand them and why you believe a wrongdoing has occurred or is likely to occur.</p>
        <p>All disclosures will be taken seriously, handled sensitively, and investigated promptly. Where appropriate, you will be kept informed of the outcome. Your identity will be protected to the extent possible, having regard to the need to investigate effectively.</p>
        <h3>Protection from detriment</h3>
        <p>Any employee who makes a protected disclosure in good faith will not suffer any detriment as a result. This includes dismissal, demotion, disciplinary action, harassment, or any other unfavourable treatment. Any employee who subjects another employee to detriment for making a protected disclosure will face disciplinary action, which may include dismissal.</p>
        <p>If you believe you have suffered a detriment as a result of making a protected disclosure, please raise this immediately with the Chair &amp;amp; CEO or, if necessary, contact the Advisory, Conciliation and Arbitration Service (ACAS) or an employment tribunal.</p>
        <h3>Relationship with confidentiality</h3>
        <p>Nothing in the company's confidentiality or data protection policies prevents you from making a protected disclosure. Your obligation to maintain confidentiality does not apply where you are making a disclosure that is protected under the Public Interest Disclosure Act 1998.</p>
        <h3>External disclosures</h3>
        <p>In most cases, concerns should be raised internally in the first instance. However, if you have raised a concern and it has not been addressed, or if you reasonably believe that raising it internally would not be appropriate, you may raise it with a prescribed body such as the Health and Safety Executive, the Information Commissioner's Office, or another relevant regulator.</p>
      </div>
    </div>

    <!-- 43. WORKING TIME -->
    <div class=&quot;sec-card&quot; id=&quot;s43&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>43</span> Working Time</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The Working Time Regulations 1998 set out statutory entitlements and limits in relation to working hours and rest. The company complies with these regulations, and this section summarises your key rights.</p>
        <h3>Maximum weekly working time</h3>
        <p>You must not work more than an average of 48 hours per week, calculated over a 17-week reference period, unless you have voluntarily agreed in writing to opt out of this limit. If you wish to opt out, or if you have already signed an opt-out agreement as part of your employment contract, you may do so. You have the right to cancel any opt-out agreement by giving the company at least seven days' written notice.</p>
        <h3>Rest breaks and rest periods</h3>
        <p>You are entitled to the following minimum rest periods:</p>
        <ul>
          <li>A rest break of at least 20 minutes where your working day exceeds six hours.</li>
          <li>A minimum daily rest period of 11 consecutive hours between working days.</li>
          <li>A minimum weekly rest period of 24 consecutive hours in every seven days, or 48 hours in every 14 days.</li>
        </ul>
        <p>As a remote-first organisation, the company trusts employees to take their rest breaks and to manage their working day responsibly. You should not feel pressured to work through breaks or to remain available outside your contracted hours.</p>
        <h3>Annual leave</h3>
        <p>Your statutory entitlement to paid annual leave is 5.6 weeks per year, inclusive of bank holidays. SDI provides 38 days per year inclusive of bank holidays, which exceeds this statutory minimum. Full details of how to request and take holiday are set out in the Holidays section of this handbook.</p>
        <h3>Night working and young workers</h3>
        <p>If your role requires regular night working, or if you are under 18, additional protections apply under the Working Time Regulations. Please speak to the Chair &amp;amp; CEO if this is relevant to your situation.</p>
      </div>
    </div>

    <!-- 44. PROBATIONARY PERIOD -->
    <div class=&quot;sec-card&quot; id=&quot;s44&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>44</span> Probationary Period</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>All new employees join the company subject to a probationary period, the length of which will be confirmed in your Letter of Engagement. The probationary period is an opportunity for both you and the company to assess whether the role is a good fit.</p>
        <h3>During probation</h3>
        <p>During your probationary period you will receive support, guidance, and regular feedback to help you settle into your role. Your line manager will check in with you regularly and raise any concerns promptly so that you have a fair opportunity to address them.</p>
        <p>The following apply specifically during your probationary period:</p>
        <ul>
          <li>You are not entitled to company sick pay. Statutory Sick Pay (SSP) will apply if you qualify.</li>
          <li>The notice period is typically shorter than the post probation notice period, as set out in your Letter of Engagement.</li>
          <li>Bonus payments are not ordinarily made during the probationary period.</li>
        </ul>
        <h3>Completion of probation</h3>
        <p>If your probationary period is completed satisfactorily, your employment will continue on the terms set out in your Letter of Engagement. You will be notified in writing when your probation has been successfully completed.</p>
        <h3>Extension or termination during probation</h3>
        <p>If performance or conduct gives cause for concern during the probationary period, the company may extend the probationary period to allow further time for improvement, or may terminate your employment. Where possible, concerns will be raised with you informally before any formal decision is made. The company will act fairly and reasonably in all cases.</p>
        <p>Termination during the probationary period will normally be with the notice set out in your Letter of Engagement or the statutory minimum, whichever is greater.</p>
      </div>
    </div>

    <!-- 45. AI USE AT WORK -->
    <div class=&quot;sec-card&quot; id=&quot;s45&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>45</span> AI Use at Work</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Artificial intelligence tools are increasingly used in professional environments and can offer genuine productivity benefits. The company supports their responsible use, subject to the guidelines in this section. This policy applies to all AI tools, including but not limited to large language models, generative AI platforms, and AI assisted software.</p>
        <h3>Approved use</h3>
        <p>You may use AI tools to assist with tasks such as drafting, research, summarising, and problem solving, provided you comply with this policy. AI tools can be a useful starting point but should not replace professional judgement, critical thinking, or quality review.</p>
        <h3>Client and company data</h3>
        <p>You must not input any confidential, personal, or sensitive data into an AI tool unless it has been specifically approved for that purpose by the Chair &amp;amp; CEO. This includes client names, contact details, financial information, personal data, commercially sensitive content, and any information that would otherwise be subject to confidentiality obligations. Entering such data into a third-party AI platform may constitute a data breach under UK GDPR.</p>
        <p>If you are unsure whether a particular tool or use case is appropriate, please speak to the Chair &amp;amp; CEO before proceeding.</p>
        <h3>Accuracy and responsibility</h3>
        <p>AI tools can produce inaccurate, misleading, or out of date outputs. You are responsible for reviewing, verifying, and taking ownership of any content you produce using AI tools before sharing it with colleagues, clients, or third parties. AI generated content does not constitute professional or legal advice and must not be presented as such.</p>
        <h3>Intellectual property and copyright</h3>
        <p>Be aware that content generated by AI tools may raise intellectual property questions. Do not present AI generated content as entirely your own original work in contexts where this would be misleading. Ensure that any AI generated content does not inadvertently reproduce copyrighted material.</p>
        <h3>Transparency</h3>
        <p>Where AI tools have been used to produce significant portions of work product shared with clients or partners, this should be disclosed where relevant and appropriate. When in doubt, err on the side of transparency.</p>
        <h3>Breach of this policy</h3>
        <p>Misuse of AI tools, including inputting confidential or personal data without authorisation, may result in disciplinary action. Serious breaches, particularly those involving a data breach or reputational risk to the company or a client, may be treated as gross misconduct.</p>
      </div>
    </div>

    <!-- 46. TEAMS VIDEO -->
    <div class=&quot;sec-card&quot; id=&quot;s46&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>46</span> Teams Video</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>As a remote-first organisation, Microsoft Teams is a core business communication platform and forms part of the company's standard working practices.</p>
        <h3>Camera use during meetings</h3>
        <p>To support effective communication, collaboration, engagement, relationship building, operational effectiveness and team wellbeing, employees are expected to have their camera switched on during internal Teams meetings wherever reasonably practicable. This expectation applies consistently across the organisation, including leadership teams. Consistency of application at all levels is essential to the integrity of this policy.</p>
        <p>The company considers the use of video to be an important element of professional remote working, helping to maintain effective interaction, communication standards, visibility, participation and stronger working relationships in the absence of a shared physical office environment.</p>
        <h3>Lawful basis and data protection</h3>
        <p>The collection and processing of visual data through video calls is carried out on the basis of the company's legitimate interests in maintaining effective remote working practices, team communication and operational performance. This interest has been balanced against the rights and freedoms of employees and is considered proportionate for the purpose of internal business communication.</p>
        <p>This policy should be read alongside the company's Data Protection policy. Recordings of meetings will only be made where there is a legitimate business reason to do so and employees will be informed in advance. Meeting recordings are subject to the company's data retention and security obligations under UK GDPR and the Data Protection Act 2018.</p>
        <h3>Exemptions and reasonable adjustments</h3>
        <p>The company recognises that there may be legitimate circumstances where the use of video is not appropriate, possible or reasonable. These may include:</p>
        <ul>
          <li>Disability or health conditions, including mental health.</li>
          <li>Neurodiversity.</li>
          <li>Religious or cultural considerations.</li>
          <li>Pregnancy related matters.</li>
          <li>Domestic or safeguarding circumstances.</li>
          <li>Temporary technical or operational issues.</li>
          <li>Any other situation requiring reasonable consideration.</li>
        </ul>
        <p>Where a protected characteristic under the Equality Act 2010 is relevant, the company has a legal duty to consider and implement reasonable adjustments. This is not discretionary. Employees are encouraged to raise any such matter with their line manager or the Chair &amp;amp; CEO as early as possible so that appropriate support can be arranged.</p>
        <p>All matters raised will be handled sensitively, confidentially and in accordance with the company's obligations under employment, equality, data protection and health and safety legislation. Where a request for adjustment is made, the company will respond in writing within a reasonable timeframe and keep a record of the decision and the reasons for it.</p>
        <h3>Purpose and proportionality</h3>
        <p>This requirement is implemented to support communication, collaboration, professionalism and positive team culture within a remote working environment. It is not intended to constitute surveillance, intrusive monitoring or a means of performance management.</p>
        <p>The company will not use video presence as a proxy for productivity or performance, and camera use alone will not form the basis of any formal assessment of an employee's work.</p>
        <h3>Non compliance</h3>
        <p>Employees are expected to comply with reasonable management instructions and established working practices. Where an employee is unable to use their camera, they should inform their line manager as soon as reasonably practicable and, where relevant, provide appropriate context so that support can be considered.</p>
        <p>Repeated failure to use video without explanation or engagement with the support process available will be addressed in accordance with the company's disciplinary procedure, beginning with an informal conversation in the first instance. This requirement will not be treated as a matter of gross misconduct unless associated with a broader pattern of serious misconduct.</p>
      </div>
    </div>

    <div class=&quot;part-divider&quot;><span class=&quot;part-divider-bar&quot;></span><span class=&quot;part-divider-text&quot;>Standard alignment</span><span class=&quot;part-divider-rule&quot;></span></div>

    <!-- V9.0 ALIGNMENT -->
    <div class=&quot;sec-card&quot; id=&quot;v9align&quot;>
