      <div class=&quot;sec-intro&quot;>SDI sets the Global Best Practice Standard for Service Desk &amp;mdash; so we hold ourselves to it too. This table maps the people-related criteria of the Standard (V9.0) to the policies in this handbook, showing how SDI both follows and embodies the best practice it promotes. The mapping is indicative; many policies support more than one criterion.</div>
      <div class=&quot;sec-body&quot; style=&quot;padding:0;&quot;>
        <table class=&quot;tbl&quot;>
          <thead><tr><th style=&quot;width:11%&quot;>Ref</th><th>V9.0 criterion</th><th style=&quot;width:34%&quot;>Where it&amp;rsquo;s addressed</th></tr></thead>
          <tbody>
            <tr><td><b>1.11</b></td><td>Employee experience programme</td><td>&amp;sect;1</td></tr>
            <tr><td><b>2.3</b></td><td>Values</td><td>&amp;sect;1</td></tr>
            <tr><td><b>2.7</b></td><td>Financial management</td><td>&amp;sect;18</td></tr>
            <tr><td><b>2.8</b></td><td>Information security management</td><td>&amp;sect;6, &amp;sect;9, &amp;sect;12, &amp;sect;13, &amp;sect;24, &amp;sect;27, &amp;sect;31, &amp;sect;32, &amp;sect;33</td></tr>
            <tr><td><b>3.3</b></td><td>Onboarding</td><td>&amp;sect;23, &amp;sect;44</td></tr>
            <tr><td><b>3.5</b></td><td>Career development programme</td><td>&amp;sect;37</td></tr>
            <tr><td><b>3.6</b></td><td>Personal performance reviews</td><td>&amp;sect;28, &amp;sect;44</td></tr>
            <tr><td><b>3.8</b></td><td>Remuneration</td><td>&amp;sect;5, &amp;sect;14, &amp;sect;41</td></tr>
            <tr><td><b>3.9</b></td><td>Informal reward &amp;amp; recognition</td><td>&amp;sect;5</td></tr>
            <tr><td><b>3.10</b></td><td>Absence management</td><td>&amp;sect;2, &amp;sect;36</td></tr>
            <tr><td><b>3.13</b></td><td>Training plans</td><td>&amp;sect;37</td></tr>

    <div class=&quot;part-divider&quot;><span class=&quot;part-divider-bar&quot;></span><span class=&quot;part-divider-text&quot;>Reference</span><span class=&quot;part-divider-rule&quot;></span></div>

    <!-- ACKNOWLEDGEMENT -->
    <div class=&quot;sec-card&quot; id=&quot;ack&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>&amp;#9745;</span> Acknowledgement of receipt</h2></div>
      <div class=&quot;sec-intro&quot;>Staff Handbook 2026 &amp;mdash; Acknowledgement of Receipt. As a remote-first organisation, SDI uses email to confirm receipt and acknowledgement of this handbook.</div>
      <div class=&quot;sec-body&quot;>
        <p>Once you have read the handbook, please send an email to the Chair &amp;amp; CEO confirming the following:</p>
        <ul>
          <li>You have received and read the SDI Staff Handbook 2026.</li>
          <li>You understand its contents.</li>
          <li>You agree to comply with the policies and procedures set out in it.</li>
          <li>You understand that this handbook is non-contractual and may be updated from time to time. The current version is always available on SharePoint.</li>
          <li>You understand that this acknowledgement does not make the handbook part of your contract of employment.</li>
        </ul>
        <p>Your email should be addressed to the Chair &amp;amp; CEO and should include your full name and job title. A copy of your email will be retained on your employment file as confirmation of receipt.</p>
        <p>If you have any questions about any part of the handbook before sending your acknowledgement, please raise them with the Chair &amp;amp; CEO. No employee should feel they are signing off on something they do not fully understand.</p>
        <h3>Suggested email wording</h3>
        <div class=&quot;note-box&quot;>
          <span class=&quot;eh&quot;>To:</span> Paul M Rodrigues &amp;mdash; Chair &amp;amp; CEO<br>
          <span class=&quot;eh&quot;>Subject:</span> SDI Staff Handbook 2026 &amp;mdash; Acknowledgement<br><br>
          Dear Paul,<br><br>
          I confirm that I have received, read, and understood the SDI Staff Handbook 2026. I agree to comply with the policies and procedures set out in it and understand that it is non-contractual.<br><br>
          [Your full name] &amp;nbsp;|&amp;nbsp; [Your job title]
        </div>
        <p style=&quot;margin-top:12px;&quot;>Please send your acknowledgement email within five working days of receiving this handbook.</p>
        <div class=&quot;callout&quot; style=&quot;margin-top:6px;&quot;><strong>Questions about this handbook?</strong> Contact any member of the executive team or refer to the current version on SharePoint.</div>
      </div>
    </div>

    <div class=&quot;part-divider&quot;><span class=&quot;part-divider-bar&quot;></span><span class=&quot;part-divider-text&quot;>Quick reference</span><span class=&quot;part-divider-rule&quot;></span></div>

    <!-- QUICK REFERENCE GUIDE -->
    <div class=&quot;sec-card&quot; id=&quot;quickref&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>QR</span> Quick reference, process &amp;amp; reporting guide</h2></div>
      <div class=&quot;sec-intro&quot;>An at-a-glance summary of the most common processes, who to tell, and key deadlines. This is a summary only &amp;mdash; where it differs from a policy, the full section of this handbook takes precedence.</div>
      <div class=&quot;sec-body&quot;>
        <h3>Who to tell, and how</h3>
        <table class=&quot;tbl&quot;>
          <thead><tr><th style=&quot;width:34%&quot;>Situation</th><th style=&quot;width:20%&quot;>Who to contact</th><th>How &amp;amp; when</th></tr></thead>
          <tbody>
            <tr><td><b>Sickness / unable to work</b></td><td>Your line manager</td><td>Phone them personally before your normal start time on day one; if still off, update by 9am each day; record in Timetastic.</td></tr>
            <tr><td><b>Data breach</b> (suspected or actual)</td><td>Chair &amp;amp; CEO</td><td>Immediately; preserve any evidence. We must notify the ICO within 72 hours where required.</td></tr>
            <tr><td><b>Bullying, harassment or dignity-at-work concern</b></td><td>Chair &amp;amp; CEO</td><td>As soon as possible; keep a written record of incidents (dates, times, what happened).</td></tr>
            <tr><td><b>Sexual harassment</b></td><td>Your line manager</td><td>Promptly; investigated confidentially, with support available.</td></tr>
            <tr><td><b>Whistleblowing</b> (protected disclosure)</td><td>Chair &amp;amp; CEO</td><td>In writing where possible, setting out the facts as you understand them.</td></tr>
            <tr><td><b>Grievance</b></td><td>Your line manager <span style=&quot;color:var(--muted)&quot;>(or Chair &amp;amp; CEO if it concerns your line manager)</span></td><td>Raise informally first; if unresolved or serious, put it in writing.</td></tr>
            <tr><td><b>Lost / stolen phone, keys or access credentials</b></td><td>Your line manager / Chair &amp;amp; CEO</td><td>Immediately.</td></tr>
            <tr><td><b>Service disruption</b> (power / internet outage)</td><td>Your line manager</td><td>At the start of your working day; set your Teams status to unavailable.</td></tr>
            <tr><td><b>Wage overpayment</b></td><td>Chair &amp;amp; CEO</td><td>Immediately on noticing.</td></tr>
            <tr><td><b>Criminal conviction during employment</b></td><td>Chair &amp;amp; CEO</td><td>When it occurs.</td></tr>
          </tbody>
        </table>

        <h3>Key deadlines &amp;amp; notice periods</h3>
        <table class=&quot;tbl&quot;>
          <thead><tr><th style=&quot;width:46%&quot;>What</th><th>Timeframe</th></tr></thead>
          <tbody>
            <tr><td><b>Report sickness</b></td><td>Before your start time on day one, then by 9am each further day of absence.</td></tr>
            <tr><td><b>SDI Self-Certification Form</b></td><td>Complete on return, for absences of 7 calendar days or fewer (available on SharePoint).</td></tr>
            <tr><td><b>Fit note</b></td><td>Required from day 8 of a continuous absence; can be issued by a GP or another healthcare professional (nurse, pharmacist, physiotherapist, occupational therapist or hospital doctor). Renew so no period is left uncertified.</td></tr>
            <tr><td><b>Holiday request notice</b></td><td>Twice the number of days requested (e.g. 5 days off &amp;rarr; 10 days' notice). Max 10 working days per request; get written approval before booking travel.</td></tr>
            <tr><td><b>Flexible working decision</b></td><td>Normally completed within 2 months of your request (up to two requests per 12 months).</td></tr>
            <tr><td><b>Subject Access Request / personnel file</b></td><td>Provided within 10 working days (SARs answered within one month, up to three for complex cases).</td></tr>
            <tr><td><b>Disciplinary or grievance appeal</b></td><td>Submit in writing within 5 working days of the decision.</td></tr>
            <tr><td><b>Carer's leave notice</b></td><td>At least 3 days, or twice the number of days requested, whichever is earlier.</td></tr>
            <tr><td><b>Handbook acknowledgement</b></td><td>Email the Chair &amp;amp; CEO within 5 working days of receipt.</td></tr>
            <tr><td><b>Repaying outstanding amounts on leaving</b></td><td>Within 1 calendar month (or 30 days of any invoice).</td></tr>
            <tr><td><b>Cancelling a 48-hour opt-out</b></td><td>At least 7 days' written notice.</td></tr>
          </tbody>
        </table>

        <h3>At a glance</h3>
        <table class=&quot;tbl&quot;>
          <thead><tr><th style=&quot;width:38%&quot;>Item</th><th>Detail</th></tr></thead>
          <tbody>
            <tr><td><b>Working week</b></td><td>34 hours &amp;mdash; Mon&amp;ndash;Thu 8 hours, Fri 7 hours; start any time between 8am and 10am.</td></tr>
            <tr><td><b>Annual leave</b></td><td>38 days, inclusive of the 8 bank holidays (pro rata for part-time).</td></tr>
            <tr><td><b>Holiday year</b></td><td>1 January to 31 December.</td></tr>
            <tr><td><b>Statutory Sick Pay (SSP)</b></td><td>Paid from day one, for up to 28 weeks.</td></tr>
            <tr><td><b>Company sick pay (after probation)</b></td><td>Full pay weeks 1&amp;ndash;6, half pay weeks 7&amp;ndash;13, per rolling 12-month period.</td></tr>
            <tr><td><b>Maximum weekly working time</b></td><td>48 hours average over 17 weeks, unless you have opted out in writing.</td></tr>
            <tr><td><b>Rest breaks</b></td><td>20 minutes if working over 6 hours; 11 hours' daily rest; 24 hours' weekly rest.</td></tr>
            <tr><td><b>Carer's leave</b></td><td>1 week unpaid per rolling 12-month period.</td></tr>
            <tr><td><b>Parental bereavement</b></td><td>2 weeks (child under 18 or stillbirth after 24 weeks).</td></tr>
            <tr><td><b>Right to disconnect</b></td><td>No expectation to respond outside your working hours, except genuine emergencies.</td></tr>
          </tbody>
        </table>

        <h3>Where things live</h3>
        <ul>
          <li><strong>Current handbook &amp;amp; policies</strong> &amp;mdash; SharePoint (always the latest version).</li>
          <li><strong>Booking &amp;amp; recording absence and holiday</strong> &amp;mdash; Timetastic.</li>
          <li><strong>Acknowledging this handbook</strong> &amp;mdash; email the Chair &amp;amp; CEO.</li>
        </ul>
        <div class=&quot;callout&quot; style=&quot;margin-top:6px;&quot;><strong>Remember:</strong> this guide is a summary for everyday use. For the full rules &amp;mdash; including discretion, conditions and exceptions &amp;mdash; always refer to the relevant policy section above.</div>
      </div>

<script>
// Sidebar active-state on scroll + smooth scrolling
(function(){
  var links = Array.prototype.slice.call(document.querySelectorAll('#sb-nav .nav-item'));
  var map = {};
  links.forEach(function(l){
    var id = l.getAttribute('href').slice(1);
    var el = document.getElementById(id);
    if(el) map[id] = l;
  });
  var ids = Object.keys(map);
  function onScroll(){
    var pos = window.scrollY + 120;
    var current = ids[0];
    ids.forEach(function(id){
      var el = document.getElementById(id);
      if(el &amp;&amp; el.offsetTop <= pos) current = id;
    });
    links.forEach(function(l){ l.classList.remove('active'); });
    if(map[current]) map[current].classList.add('active');
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  links.forEach(function(l){
    l.addEventListener('click', function(e){
      var id = l.getAttribute('href').slice(1);
      var el = document.getElementById(id);
      if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
    });
  });
})();
// Collapsible sections
(function(){
  document.querySelectorAll('.sec-head').forEach(function(head){
    var ch = document.createElement('span');
    ch.className = 'sec-chevron';
    ch.textContent = '\u25BE';
    head.appendChild(ch);
    head.addEventListener('click', function(){
      var card = head.closest('.sec-card');
      if(card) card.classList.toggle('collapsed');
    });
  });
  window.foldAll = function(collapse){
    document.querySelectorAll('.sec-card').forEach(function(c){
      c.classList.toggle('collapsed', collapse);
    });
  };
  // Clicking a sidebar link expands its target so the content is visible
  document.querySelectorAll('#sb-nav .nav-item').forEach(function(l){
    l.addEventListener('click', function(){
      var el = document.getElementById(l.getAttribute('href').slice(1));
      if(el) el.classList.remove('collapsed');
    });
  });
})();
// Collapsible part groups (whole-section folding)
(function(){
  function membersOf(div){
    var out = [], el = div.nextElementSibling;
    while(el &amp;&amp; !el.classList.contains('part-divider') &amp;&amp; !el.classList.contains('doc-footer')){
      out.push(el);
      el = el.nextElementSibling;
    }
    return out;
  }
  function setPart(div, collapsed){
    div.classList.toggle('part-collapsed', collapsed);
    membersOf(div).forEach(function(el){ el.classList.toggle('part-hidden', collapsed); });
  }
  document.querySelectorAll('.part-divider').forEach(function(div){
    var ch = document.createElement('span');
    ch.className = 'part-chevron';
    ch.textContent = '\u25BE';
    div.appendChild(ch);
    div.addEventListener('click', function(){
      setPart(div, !div.classList.contains('part-collapsed'));
    });
  });
  document.querySelectorAll('#sb-nav .nav-item').forEach(function(l){
    l.addEventListener('click', function(){
      var target = document.getElementById(l.getAttribute('href').slice(1));
      var el = target;
      while(el){
        if(el.classList &amp;&amp; el.classList.contains('part-divider')){ setPart(el, false); break; }
        el = el.previousElementSibling;
      }
    });
  });
})();
</script>

<script>
(function(){
  function d(id){return document.getElementById(id);}
  // live calendar-day calc + fit-note warning
  function parse(v){ if(!v) return null; var p=v.split('-'); if(p.length!==3) return null; return new Date(+p[0], +p[1]-1, +p[2]); }
  function recalc(){
    var f=parse(d('ab-first').value), l=parse(d('ab-last').value);
    var note=d('calc-note'), out=d('ab-caldays');
    if(!f||!l){ out.value=''; note.className='calc-note'; note.textContent=''; return; }
    var days=Math.round((l-f)/86400000)+1;
    if(days<1){ out.value=''; note.className='calc-note warn'; note.textContent='The last day of absence is before the first day — please check the dates.'; return; }
    out.value=days+(days===1?' day':' days');
    if(days>7){ note.className='calc-note warn'; note.textContent='⚠ This absence is longer than 7 calendar days. A fit note is required from the 8th day onwards — self-certification alone does not cover it. Please give your fit note to your line manager as well.'; }
    else { note.className='calc-note ok'; note.textContent='✓ Within the 7-day self-certification limit — no fit note required for this absence.'; }
  }
  ['ab-first','ab-last'].forEach(function(id){ d(id).addEventListener('change',recalc); });

  // Print

  // Clear
  (function(){
  var __EMP={}; ['emp-name','emp-title','emp-dept','emp-mgr'].forEach(function(id){ var e=d(id); if(e) __EMP[id]=e.value; });
  var armed=false, timer=null, rb=d('btn-reset'), origHTML=rb.innerHTML;
  function disarm(){ armed=false; rb.innerHTML=origHTML; rb.style.background=''; rb.style.borderColor=''; rb.style.color=''; if(timer){clearTimeout(timer);timer=null;} }
  function doClear(){ document.querySelectorAll('input,textarea').forEach(function(el){ if(el.type==='radio'||el.type==='checkbox') el.checked=false; else el.value=''; }); recalc(); Object.keys(__EMP).forEach(function(id){ if(d(id)) d(id).value=__EMP[id]; }); }
  rb.addEventListener('click',function(){ if(!armed){ armed=true; rb.innerHTML='Click again to clear'; rb.style.background='#fef3c7'; rb.style.borderColor='#f0c96b'; rb.style.color='#92400e'; timer=setTimeout(disarm,3500); return; } disarm(); doClear(); });
})();

  // Download a filled standalone copy (bakes current values into the HTML)
  d('btn-download').addEventListener('click',function(){
    document.querySelectorAll('input').forEach(function(el){
      if(el.type==='radio'||el.type==='checkbox'){ if(el.checked) el.setAttribute('checked','checked'); else el.removeAttribute('checked'); }
      else el.setAttribute('value', el.value);
    });
    document.querySelectorAll('textarea').forEach(function(el){ el.textContent=el.value; });
    var name=(d('emp-name').value||'').trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    var fn='SDI_Self_Certification'+(name?('_'+name):'')+'.html';
    var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var blob=new Blob([html],{type:'text/html'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },100);
  });
})();
</script>
</body>

  function addRow(data){ var tr=document.createElement('tr'); tr.innerHTML=rowHtml(); d('items-body').appendChild(tr);
    tr.querySelector('.i-amt').addEventListener('input',recalc);

    return tr;
  }
  function recalc(){ var t=0; document.querySelectorAll('.i-amt').forEach(function(el){ var v=parseFloat(el.value); if(!isNaN(v)) t+=v; }); d('grand-total').textContent=money(t); }
  d('add-row').addEventListener('click',function(){ addRow(); });
  for(var r=0;r<4;r++) addRow();
  recalc();

  // Mileage calculator @ 35p per mile
  var RATE_PPM=35, RATE=RATE_PPM/100;

  d('mc-miles').addEventListener('input',mcCalc);
  d('mc-add').addEventListener('click',function(){
    var m=parseFloat(d('mc-miles').value)||0; if(m<=0){ d('mc-miles').focus(); return; }
    var j=(d('mc-journey').value||'').trim();
    var desc=(j?j+' — ':'')+m+' miles @ '+RATE_PPM+'p/mile';
    var tr=addRow({cat:'Mileage',desc:desc,amt:(m*RATE).toFixed(2)});
    recalc();
    d('mc-miles').value=''; d('mc-journey').value=''; mcCalc();
    tr.scrollIntoView({behavior:'smooth',block:'nearest'});

  (function(){
  var __EMP={}; ['c-name','c-dept','c-mgr'].forEach(function(id){ var e=d(id); if(e) __EMP[id]=e.value; });
  var armed=false, timer=null, rb=d('btn-reset'), origHTML=rb.innerHTML;
  function disarm(){ armed=false; rb.innerHTML=origHTML; rb.style.background=''; rb.style.borderColor=''; rb.style.color=''; if(timer){clearTimeout(timer);timer=null;} }
  function doClear(){ document.querySelectorAll('input,textarea').forEach(function(el){ if(el.type==='radio'||el.type==='checkbox') el.checked=false; else el.value=''; }); document.querySelectorAll('select').forEach(function(s){ s.selectedIndex=0; }); d('items-body').innerHTML=''; for(var r=0;r<4;r++) addRow(); recalc(); mcCalc(); Object.keys(__EMP).forEach(function(id){ if(d(id)) d(id).value=__EMP[id]; }); }
  rb.addEventListener('click',function(){ if(!armed){ armed=true; rb.innerHTML='Click again to clear'; rb.style.background='#fef3c7'; rb.style.borderColor='#f0c96b'; rb.style.color='#92400e'; timer=setTimeout(disarm,3500); return; } disarm(); doClear(); });
})();
  d('btn-download').addEventListener('click',function(){

    document.querySelectorAll('textarea').forEach(function(el){ el.textContent=el.value; });
    var name=(d('c-name').value||'').trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
    var fn='SDI_Expense_Claim'+(name?('_'+name):'')+'.html';
    var blob=new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100);
  });
})();

    window.addEventListener('message', function(e){
      if(e && e.data && e.data.type==='sdi-actions'){ __actions = e.data.actions || []; __responses = e.data.responses || {}; if(!panels.followup.classList.contains('hidden')) renderFollowup(); }

        if(a.source) meta+='<span><b>From:</b> '+escapeHtml(a.source)+'</span>';

  }
  function addNoMatch(doc,key,term){ var root = key==='followup'? doc.getElementById('followup') : doc.body; if(!root) return; var div=doc.createElement('div'); div.className='sdi-nomatch'; div.textContent='No matches for \u201C'+term+'\u201D in this tab.'; root.insertBefore(div, root.firstChild); }
  function unwrap(doc, rootSel){

    for(var i=0;i<marks.length;i++){ var m=marks[i]; m.parentNode.replaceChild(doc.createTextNode(m.textContent), m); }
    try{ root.normalize(); }catch(e){}
    var hid=root.querySelectorAll('.sdi-hidden'); for(var j=0;j<hid.length;j++) hid[j].classList.remove('sdi-hidden'); var nm=root.querySelectorAll('.sdi-nomatch'); for(var z=0;z<nm.length;z++) nm[z].parentNode.removeChild(nm[z]);
  }
  function wrapMatches(doc, root, term){
    var hits=[], low=term.toLowerCase();
    var walker=doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode:function(n){
        if(!n.nodeValue || n.nodeValue.toLowerCase().indexOf(low)===-1) return NodeFilter.FILTER_REJECT;
        var p=n.parentNode;
        while(p && p!==root){
          var tag=p.nodeName;
          if(tag==='SCRIPT'||tag==='STYLE'||tag==='TEXTAREA'||tag==='MARK'||tag==='OPTION'||tag==='INPUT') return NodeFilter.FILTER_REJECT;
          p=p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes=[], cur;
    while(cur=walker.nextNode()) nodes.push(cur);
    for(var k=0;k<nodes.length;k++){
      var node=nodes[k], text=node.nodeValue, lt=text.toLowerCase(), idx=0, pos, last=0, found=false;
      var frag=doc.createDocumentFragment();
      while((pos=lt.indexOf(low,idx))!==-1){
        found=true;
        if(pos>last) frag.appendChild(doc.createTextNode(text.slice(last,pos)));
        var mk=doc.createElement('mark'); mk.className='sdi-hit'; mk.textContent=text.slice(pos,pos+term.length);
        frag.appendChild(mk); hits.push(mk);
        last=pos+term.length; idx=last;
      }
      if(found){ if(last<text.length) frag.appendChild(doc.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag,node); }
    }
    return hits;
  }
  function applyFilter(key, doc){
    try{
      if(key==='handbook'){
        doc.querySelectorAll('.sec-card').forEach(function(c){ if(c.querySelector('mark.sdi-hit')) c.classList.remove('collapsed'); else c.classList.add('sdi-hidden'); });
        doc.querySelectorAll('#sb-nav .nav-item').forEach(function(a){ var id=(a.getAttribute('href')||'').slice(1); var t=id&&doc.getElementById(id); if(t && !t.querySelector('mark.sdi-hit')) a.classList.add('sdi-hidden'); });
      } else if(key==='review'){
        var cont=doc.getElementById('sec-container');
        if(cont) cont.querySelectorAll('.sec-card').forEach(function(c){ if(c.querySelector('mark.sdi-hit')) c.classList.remove('collapsed'); else c.classList.add('sdi-hidden'); });
      } else if(key==='jd'){
        var body=doc.querySelector('.body'); if(!body) return;
        var kids=Array.prototype.slice.call(body.children), group=[], groups=[];
        kids.forEach(function(el){ if(el.tagName==='H2'){ if(group.length) groups.push(group); group=[el]; } else if(group.length) group.push(el); });
        if(group.length) groups.push(group);
        groups.forEach(function(g){
          var has=g.some(function(el){ return el.querySelector && el.querySelector('mark.sdi-hit'); });
          if(!has){ g.forEach(function(el){ el.classList.add('sdi-hidden'); }); }
          else { g.forEach(function(el){ if(el.classList && el.classList.contains('section-body')) el.classList.remove('hidden'); }); if(g[0].classList) g[0].classList.remove('collapsed'); }
        });
      } else if(key==='followup'){
        var fu=document.getElementById('fu-list');
        if(fu) fu.querySelectorAll('.fu-item').forEach(function(c){ if(!c.querySelector('mark.sdi-hit')) c.classList.add('sdi-hidden'); });
      }
    }catch(e){}
  }
  function clearAll(){
    TAB_ORDER.forEach(function(key){ var doc=panelDoc(key); if(doc) unwrap(doc, key==='followup'?'#followup':null); });
    HITS=[]; CURRENT=-1;
  }
  function run(term){
    clearAll();
    CURTERM=(term||'').trim();
    if(CURTERM.length<2){ updateCount(); return; }
    TAB_ORDER.forEach(function(key){
      var doc=panelDoc(key), root=panelRoot(key);
      if(!doc||!root) return;
      ensureStyle(doc);
      var hs=wrapMatches(doc, root, CURTERM);
      applyFilter(key, doc);
      if(hs.length===0) addNoMatch(doc, key, CURTERM);
      if(key==='followup') hs.forEach(function(m,i){ HITS.push({tab:key, ord:i, mark:m}); });
      else hs.forEach(function(m){ HITS.push({tab:key, mark:m}); });
    });
    CURRENT = -1;
    updateCount();
  }
  function updateCount(){
    var c=document.getElementById('sdi-count'), q=document.getElementById('sdi-q');
    if(c) c.textContent = HITS.length ? (CURRENT<0 ? (HITS.length+' match'+(HITS.length>1?'es':'')) : ((CURRENT+1)+' / '+HITS.length)) : (q.value.trim().length>=2?'0 results':'');
    var pv=document.getElementById('sdi-prev'), nx=document.getElementById('sdi-next');
    if(pv){ pv.disabled=nx.disabled=(HITS.length<1); }
  }
  function clearActive(){ TAB_ORDER.forEach(function(key){ var d=panelDoc(key); if(d) d.querySelectorAll('mark.sdi-hit.sdi-active').forEach(function(m){m.classList.remove('sdi-active');}); }); }
  function activate(idx){
    if(idx<0||idx>=HITS.length) return;
    CURRENT=idx; clearActive();
    var h=HITS[idx];
    if(h.tab==='followup'){
      _suppress=true; try{_origShow('followup');}catch(e){} _suppress=false;
      var doc=document; ensureStyle(doc); unwrap(doc,'#followup');
      var arr=wrapMatches(doc, document.getElementById('followup'), CURTERM); applyFilter('followup',doc);
      var mk=arr[h.ord]; if(mk){ mk.classList.add('sdi-active'); setTimeout(function(){try{mk.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}},70); }
      updateCount(); return;
    }
    var m=h.mark, d=m.ownerDocument;
    var pg=m.closest&&m.closest('.page'); if(pg){ d.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');}); pg.classList.add('active'); }
    var card=m.closest&&m.closest('.sec-card'); if(card){ card.classList.remove('collapsed'); card.classList.remove('sdi-hidden'); }
    var sbd=m.closest&&m.closest('.section-body'); if(sbd) sbd.classList.remove('hidden');
    m.classList.add('sdi-active');
    _suppress=true; try{ window.__showTab(h.tab); }catch(e){} _suppress=false;
    setTimeout(function(){ try{ m.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }, 70);
    updateCount();
  }
  function step(dir){ if(HITS.length<1) return; var i; if(CURRENT<0){ i = dir>0?0:HITS.length-1; } else { i=(CURRENT+dir+HITS.length)%HITS.length; } activate(i); }

  // patch tab switch so Follow-up (which re-renders on show) keeps highlights
  window.__showTab=function(t){
    _origShow(t);
    if(!_suppress && CURTERM.length>=2 && t==='followup'){
      var doc=document; ensureStyle(doc); unwrap(doc,'#followup');
      wrapMatches(doc, document.getElementById('followup'), CURTERM); applyFilter('followup',doc);
    }
  };

  var q=document.getElementById('sdi-q');
  q.addEventListener('input', function(){ clearTimeout(timer); timer=setTimeout(function(){ run(q.value); }, 220); });
  q.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); step(e.shiftKey?-1:1); } else if(e.key==='Escape'){ q.value=''; CURTERM=''; clearAll(); updateCount(); } });
  document.getElementById('sdi-next').addEventListener('click', function(){ step(1); });
  document.getElementById('sdi-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('sdi-clear').addEventListener('click', function(){ q.value=''; CURTERM=''; clearAll(); updateCount(); q.focus(); });
  updateCount();
})();
</script>
