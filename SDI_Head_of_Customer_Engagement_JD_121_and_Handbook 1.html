  <h2>Role Purpose</h2>
  <p>To drive SDI's commercial growth by hunting and winning new business, proactively generating, developing and closing new customers across awards, conferences and events, exams, membership and training, and then retaining and growing the accounts won, owning the revenue result for the area and protecting gross profit through pricing discipline and collaboration with the team. Alongside this, the role leads and develops the Customer Engagement team to consistently deliver SDI's brand promise of Surprise, Delight and Inspire. This is a strategic, revenue-owning leadership role reporting to the Chief Financial Officer. The Head of Customer Engagement is accountable for the area's commercial outcomes and for the performance and development of the team, and is expected to proactively hunt opportunities and shape those results, linking activity back to financial return, rather than respond to requests or carry out day-to-day training administration.</p>

  <p>In doing so, the role advances SDI's mission as the authority on service desk best practice. Every sale connects customers to SDI's professional qualification standards, the Service Desk Analyst (SDA) and Service Desk Manager (SDM) Professional Standards (v9.0), and to SDI's Global Best Practice Standard for Service Desk (v9.0), against which service desks are certified. Commercial growth and the raising of professional standards across the industry go hand in hand.</p>

  <h2>What &quot;Head of&quot; Means</h2>
  <p>A &quot;Head of&quot; role is a leadership position accountable for a whole function or area of the business, not an individual contributor or purely administrative role. At SDI, a Head of:</p>
  <ul>
    <li><span class=&quot;lead&quot;>Owns outcomes for their area</span>: is accountable for the results, targets and overall performance of the function, not just their own tasks.</li>
    <li><span class=&quot;lead&quot;>Leads people</span>: sets direction, expectations and standards for a team, and develops the people in it.</li>
    <li><span class=&quot;lead&quot;>Holds decision-making authority</span>: makes and is trusted with decisions within their remit, and manages the associated budget and priorities.</li>
    <li><span class=&quot;lead&quot;>Sets and drives the plan</span>: translates SDI's strategy into goals and delivery for the area, and reports on progress.</li>
    <li><span class=&quot;lead&quot;>Represents the function</span>: acts as the senior point of contact and voice for the area, internally and externally.</li>
  </ul>
  <p class=&quot;note-txt&quot;>In short, the title signals accountability for an area and its people and results, the &quot;how&quot; and &quot;what&quot; are set out in the priorities and responsibilities below.</p>

  <h2>Top Priorities</h2>
  <p class=&quot;note-txt&quot;>In order of importance. These define where the role should focus most of its time and are the basis for objective setting and review.</p>
  <ol class=&quot;priorities&quot;>
    <li><span class=&quot;lead&quot;>Hunt and win new business</span>: proactively generate, develop and close new customers and members across all product areas; follow up and convert marketing generated leads and turn non-members into members.</li>
    <li><span class=&quot;lead&quot;>Deliver sales and revenue targets</span>: accountable for the total annual revenue target of £839,757 across new membership, multi-year membership, membership renewals and training, meeting the agreed monthly, quarterly and annual numbers and helping to protect the gross profit result. Of this, web sales (via Business Administration) deliver 15% (£125,964); the Head of Customer Engagement and the Senior Account Manager (Joanna Beauchamp) work the remaining 85% (£713,793) together as one combined target, with the role leading on winning new (non-member) business (see target ownership below).</li>
    <li><span class=&quot;lead&quot;>Grow and hand over accounts won</span>: develop trusted relationships and grow each new account through its first year, then hand it to the Senior Account Manager (Joanna Beauchamp) in year two for ongoing management; and generate well-informed qualified leads for the Service Desk Certification, Service Desk Recruitment and Consultancy teams.</li>
    <li><span class=&quot;lead&quot;>Lead and develop the team</span>: set clear expectations and goals, mentor and grow team members, empower decision-making, and hold regular one-to-ones.</li>
  </ol>

  <h2>Key Responsibilities</h2>

  <h3>Sales, Customers and Revenue</h3>
  <ul>
    <li>Engage and interact with all customers in a way that demonstrates the SDI brand, by phone, email, live chat, social media or face-to-face.</li>
    <li>Proactively develop sales opportunities and follow up new prospects and marketing generated leads across all product areas, using Salesforce, Pardot or any other platform that supports opportunities.</li>
    <li>Create value for customers by recommending appropriate SDI products and services, aligned to SDI's Global Best Practice Standard for Service Desk and professional qualification standards (SDA and SDM), and negotiate and influence accordingly.</li>
    <li>Convert non-member accounts into members and develop existing accounts.</li>
    <li>Actively identify Service Desk Certification (SDC) and Consultancy / Professional Services opportunities and pass them to the Chief Customer Success Officer to progress.</li>
    <li>Ensure agreed annual revenue targets for training, new membership and membership retention are met, and that gross profit is protected.</li>
  </ul>

  <h3>Leadership and People Management</h3>
  <ul>
    <li>Provide inspired, values-led leadership and communicate SDI's vision, mission, values and goals to the team.</li>
    <li>Set transparent expectations and goals, and encourage open, honest, adult-to-adult conversations.</li>
    <li>Line manage the Senior Account Manager (Joanna Beauchamp), mentor and develop her, hold regular one-to-ones, and manage performance, objectives and day-to-day support.</li>
    <li>Manage people administration: approve holiday and record sickness/absence (Timetastic), conduct return-to-work interviews, and handle medical appointment requests per the Staff Handbook.</li>
  </ul>

  <h3>One-to-One Structure (Line Management)</h3>
  <p>One-to-ones with the Senior Account Manager follow a set cadence and agenda so each session covers the same ground.</p>
  <ul>
    <li><span class=&quot;lead&quot;>Cadence</span>: regular review with Joanna Beauchamp, against the 2026 budget.</li>
    <li><span class=&quot;lead&quot;>Standard agenda</span>: new-business pipeline vs target; member and non-member performance; wins, blockers and support needed; gross profit and discounting discipline; development and objectives; and agreed actions carried forward.</li>
  </ul>

  <h3>Operations, Budget and Reporting</h3>
  <ul>
    <li>Provide a weekly update to the Chief Financial Officer that reviews each product and service line in detail (training, new membership, multi-year membership and membership renewals), covering pipeline, sales performance against target and budget, the member/non-member split, wins, and any risks or support needed.</li>
    <li>Provide monthly reporting against goals and project KPIs (key performance indicators).</li>
  </ul>

  <h2>Commercial Ownership and Initiative</h2>
  <p>A Head of is expected to anticipate and shape their area's commercial performance, not simply respond to requests. In practice this means:</p>
  <ul>
    <li><span class=&quot;lead&quot;>Bring ideas, not just answers</span>: proactively identify opportunities to grow revenue or margin and come with proposals and options, not questions.</li>
    <li><span class=&quot;lead&quot;>Link everything to financial return</span>: express proposals, decisions and initiatives in terms of their commercial impact (revenue, margin, cost saved or value created). If it can't be linked to a return, it is an activity, not yet a proposal.</li>
    <li><span class=&quot;lead&quot;>Protect gross profit; discount as a last resort</span>: gross profit is influenced, not directly controlled, so protect it through pricing discipline, product and channel mix, and collaboration with the wider team. Use discounting only as a solution of last resort; where a discount is unavoidable, offset it by selling more so the gross profit result is protected.</li>
    <li><span class=&quot;lead&quot;>Think outside the box with a solutions-driven attitude</span>: use creativity to solve commercial problems, turn obstacles into opportunities, and open new revenue, always tied back to the numbers.</li>
    <li><span class=&quot;lead&quot;>Own the outcome</span>: take accountability for the result of the area, anticipate rather than wait to be asked, and shape the plan proactively.</li>
  </ul>

  <h2>Authority and Decision Rights</h2>
  <ul>
    <li><span class=&quot;lead&quot;>Discounting</span>: may approve discounts up to 5% of list price; anything beyond requires Chief Financial Officer approval. Discounting is a last resort and, where used, must be offset by additional volume.</li>
    <li><span class=&quot;lead&quot;>Pricing</span>: works within agreed SDI price lists; non-standard or bespoke pricing requires Chief Financial Officer sign-off.</li>
  </ul>

  <h2>How Success Is Measured</h2>
  <p class=&quot;note-txt&quot;>Performance in the role is assessed against the following measures. Specific figures are set annually with the Chief Financial Officer.</p>
  <table class=&quot;kpi&quot;>
    <tr><th>Measure</th><th>What good looks like</th></tr>
    <tr><td>Sales targets</td><td>Achievement of monthly, quarterly and annual targets for new membership, public and in-house training, exams, and awards, conferences and events.</td></tr>
    <tr><td>Revenue &amp;amp; gross profit</td><td>Annual revenue target met; gross profit protected, influenced (not directly controlled) through pricing discipline, product mix and collaboration with the team.</td></tr>
    <tr><td>Membership retention</td><td>Retention rate across the member account base.</td></tr>
    <tr><td>New member conversion</td><td>Number/value of non-member accounts converted to members.</td></tr>
    <tr><td>Qualified pipeline</td><td>Volume and quality of qualified leads passed to the Service Desk Certification, Service Desk Recruitment and Consultancy teams.</td></tr>
    <tr><td>Team performance &amp;amp; development</td><td>Team goals met, delivery against KPIs in ASANA, and evidence of team growth and engagement.</td></tr>
    <tr><td>Brand experience</td><td>Every internal and external interaction delivers on Surprise, Delight and Inspire.</td></tr>
    <tr><td>Commercial initiative</td><td>Evidence of proactive, commercially framed proposals, each with a clear link to financial return, rather than reactive task completion.</td></tr>
  </table>

  <h2>Revenue Targets (2026 Budget)</h2>
  <p class=&quot;note-txt&quot;>Annual sales targets for 2026, reconciled to the 2026 annual budget (which details each line by month).</p>
  <table class=&quot;kpi targets&quot;>
    <tr><th>Area</th><th>Annual target (2026)</th></tr>
    <tr><td>Training</td><td>£566,802</td></tr>
    <tr><td>New Membership</td><td>£75,150</td></tr>
    <tr><td>Multi-Year Membership</td><td>£26,273</td></tr>
    <tr><td>Membership Renewals (before cancellations)</td><td>£214,415</td></tr>
    <tr><td>Membership Cancellations</td><td>(£42,883)</td></tr>
    <tr style=&quot;font-style:italic;&quot;><td>Membership subtotal</td><td>£272,955</td></tr>
    <tr><td>Total</td><td>£839,757</td></tr>
  </table>
  <p><span class=&quot;lead&quot;>New business vs existing.</span> New Membership (£75,150) is the pure new-business target, won by hunting new (non-member) customers. Multi-Year Membership, Membership Renewals and Cancellations are existing member business, largely handled through the Senior Account Manager (Joanna Beauchamp), whom this role manages. Training (£566,802) is a mix of new and existing custom.</p>

  <p><span class=&quot;lead&quot;>Target ownership.</span> The Head of Customer Engagement is accountable for the full £839,757. The Head of Customer Engagement and the Senior Account Manager (Joanna Beauchamp) work a combined sales target of £713,793 (85%) together as one number; web sales (via Business Administration) deliver the remaining 15% (£125,964):</p>
  <table class=&quot;kpi targets&quot;>
    <tr><th>Owner / channel</th><th>Annual target</th></tr>
    <tr><td>Head of Customer Engagement &amp;amp; Senior Account Manager (together, 85%)</td><td>£713,793</td></tr>
    <tr><td>Web sales, via Business Administration (15%)</td><td>£125,964</td></tr>
    <tr><td>Total (accountable for)</td><td>£839,757</td></tr>
  </table>

  <h2>Scope and Boundaries</h2>
  <p>Customer Engagement is a distinct function from Business Administration (Bethaney Moore, Head of Business Administration), which sits under the Chief Customer Success Officer. Although the two roles were historically in one line, they now operate in separate reporting lines, so the boundary is functional rather than managerial:</p>
  <ul>
    <li><span class=&quot;lead&quot;>Head of Customer Engagement</span> wins and owns the customer relationship, sets the commercial direction, and carries the revenue and team leadership accountability.</li>
    <li><span class=&quot;lead&quot;>Head of Business Administration</span> (within Customer Success) organises and runs the resulting courses, bookings, logistics, PeopleCert exams, records and invoicing administration, and will close web sales.</li>
  </ul>
  <p>Where a task involves training, Customer Engagement is accountable for the sale and the relationship; Business Administration is accountable for delivery and administration. This role does not carry day-to-day training administration duties.</p>

  <h2>Key Stakeholders and Interfaces</h2>
  <p>The role depends on and works closely with:</p>
  <ul>
    <li><span class=&quot;lead&quot;>Chief Financial Officer</span> (line manager): targets, budget, pricing and weekly reporting.</li>
    <li><span class=&quot;lead&quot;>Senior Account Manager, Joanna Beauchamp</span> (direct report): existing account management and sales support.</li>
    <li><span class=&quot;lead&quot;>Chief Experience Officer and Marketing</span>: lead generation and campaigns feeding the new-business pipeline.</li>
    <li><span class=&quot;lead&quot;>Chief Customer Success Officer</span>: hand-off of SDC and Consultancy / Professional Services opportunities, and training delivery.</li>
    <li><span class=&quot;lead&quot;>Business Administration and SDI Associates</span>: course administration and delivery.</li>
    <li><span class=&quot;lead&quot;>Finance and third-party suppliers</span>: invoicing, terms and the PeopleCert, Mimeo and Brighthorse contracts.</li>
  </ul>

  <h2>Behavioural Profile (Insights Discovery Colour Energies)</h2>
  <p>Everyone brings a unique blend of all four colour energies. This role calls most strongly for <span class=&quot;lead&quot;>Fiery Red</span> and <span class=&quot;lead&quot;>Sunshine Yellow</span>: the drive to win new business and the ability to engage and persuade people, supported by <span class=&quot;lead&quot;>Earth Green</span> for leading and developing the team, and <span class=&quot;lead&quot;>Cool Blue</span> for managing targets, budgets and reporting with accuracy. The blend below is a guide to strengths and ways of working, not a fixed requirement.</p>
  <table class=&quot;kpi energies&quot;>
    <tr><th>Colour energy</th><th>Emphasis</th><th>How it shows up in this role</th></tr>
    <tr><td><span class=&quot;dot dot-red&quot;></span>Fiery Red</td><td>Lead</td><td>Goal-oriented and decisive, carries the revenue target, protects gross profit, makes quick commercial decisions, and drives the team to results.</td></tr>
    <tr><td><span class=&quot;dot dot-yellow&quot;></span>Sunshine Yellow</td><td>Lead</td><td>Dynamic and sociable, builds relationships, engages and persuades customers, brings optimism and energy to every interaction.</td></tr>
    <tr><td><span class=&quot;dot dot-green&quot;></span>Earth Green</td><td>Supporting</td><td>Supportive and relationship-oriented, develops trusted customer relationships, mentors the team, and fosters a steady, collaborative culture.</td></tr>
    <tr><td><span class=&quot;dot dot-blue&quot;></span>Cool Blue</td><td>Supporting</td><td>Analytical and structured, manages budgets, KPIs and reporting accurately, and keeps pipeline and account data disciplined.</td></tr>
  </table>

  <h2>Values and Ways of Working</h2>
  <p>The Head of Customer Engagement is expected to embody SDI's Employee Value Proposition, to care; commit to the brand and values; contribute to a positive culture; continually improve; value, support and inspire each other; be open, fair, honest and professional; and be proactive and forward-thinking, and to model the SDI brand values: Be Curious and Creative; Be Open-Minded, Positive and Bold; Be Passionate and Shine; Explore Stuff and Grow; Create Fun; Share a Great Experience; Amaze and WOW; Love Customers; Build Brilliant Friendships; Smile.</p>

  <h2>Alignment with SDI's Best Practice Standard</h2>
  <p>This role most directly reflects and promotes the following concepts of SDI's Global Best Practice Standard for Service Desk (v9.0):</p>
  <ul>
    <li><span class=&quot;lead&quot;>Leadership (Concept 1)</span>: Service Desk influence (1.2), promoting the Service Desk (1.5), driving a culture of continual improvement and customer experience (1.7 to 1.8), and leadership development (1.10).</li>
    <li><span class=&quot;lead&quot;>People Management (Concept 3)</span>: recruiting, developing and leading the team, including skills, career development, reward and team engagement.</li>
    <li><span class=&quot;lead&quot;>Customer Experience (Concept 7)</span>: customer experience (7.1), customer expectations (7.4) and relationship management (7.6).</li>
    <li><span class=&quot;lead&quot;>Professionalism and ethics (Concept 9)</span>: upholding professional and ethical standards in every customer interaction (9.4).</li>
  </ul>

  <p class=&quot;note-txt&quot;>Reference documents: SDI Global Best Practice Standard for Service Desk (v9.0); SDI Service Desk Analyst (SDA) Professional Standard (v9.0); SDI Service Desk Manager (SDM) Professional Standard (v9.0).</p>

  <h2>Additional Requirements</h2>
  <ul>
    <li>Attend SDI's annual conference and awards and other external events.</li>
    <li>Ensure all company policies and rules in the Staff Handbook are adhered to.</li>
    <li>Support other parts of the organisation with occasional projects and ad hoc requests.</li>
    <li>Ensure all communications are in line with brand values and company policy.</li>
    <li>Microsoft Teams video is a core communication tool and must be used during core working hours.</li>
    <li>Take responsibility for personal development and continuously improve knowledge of SDI products, services and the industry.</li>
    <li>Actively participate in SDI strategy meetings and operational updates.</li>
  </ul>

  <h2>Quick Reference: Key KPIs</h2>
  <table class=&quot;kpi&quot;>
    <tr><th>KPI</th><th>Target / measure</th></tr>
    <tr><td>Total revenue (accountable for)</td><td>£839,757</td></tr>
    <tr><td>Team sales target (Head of Customer Engagement &amp;amp; Senior Account Manager, together)</td><td>£713,793 (85%)</td></tr>
    <tr><td>New Membership (new business, hunted)</td><td>£75,150</td></tr>
    <tr><td>Membership renewals (retention)</td><td>£214,415 (minimise cancellations)</td></tr>
    <tr><td>Web sales (via Business Administration)</td><td>£125,964 (15%)</td></tr>
    <tr><td>Gross profit</td><td>Protected; discount up to 5% (last resort)</td></tr>
    <tr><td>Reporting</td><td>Weekly to the Chief Financial Officer (by line); monthly KPIs</td></tr>
    <tr><td>Standards</td><td>Uphold SDI's Global Best Practice Standard (v9.0) and SDA/SDM (v9.0)</td></tr>
  </table>

  <h2>Agreed</h2>
  <p class=&quot;note-txt&quot;>This job description reflects the role as at July 2026 and will be reviewed annually or when the role materially changes.</p>
  <div class=&quot;sign&quot;>
    <div class=&quot;col&quot;>
      <div class=&quot;line&quot;>Post-holder: Ruth Collins, Head of Customer Engagement</div>
      <div class=&quot;line&quot;>Line Manager: Sam Rodrigues, Chief Financial Officer</div>
    </div>

      <div class=&quot;line&quot;>Date:</div>

  <div class=&quot;note&quot; style=&quot;margin-top:20px;&quot;>
    <span class=&quot;ttl&quot;>Reminder: Accountable vs Responsible</span>
    <strong>Accountable:</strong> ultimately answerable for the outcome. The one who owns the result and cannot pass that ownership on; only one person is accountable for any given outcome.<br>
    <strong>Responsible:</strong> does the work to deliver the outcome; this can be shared across several people.<br>
    A Head of is <em>accountable</em> for their area: they own the result, whoever carries out the tasks.
  </div>

.cfo-kpi{padding:14px 18px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.cfo-kpi:nth-child(2n){border-right:none;}
.cfo-kpi:nth-last-child(-n+2){border-bottom:none;}
.cfo-kpi-name{font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.cfo-kpi-desc{font-size:10.5px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.cfo-kpi-fields{display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;align-items:end;}
.cfo-kpi-field label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:3px;}
.cfo-kpi-field input{width:100%;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;color:var(--ink);background:var(--surface);box-sizing:border-box;}
.cfo-kpi-field input:focus{outline:none;border-color:var(--navy-mid);}
.cfo-rag{display:flex;flex-direction:column;gap:4px;}
.cfo-rag label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.cfo-rag-btns{display:flex;gap:4px;}
.cfo-rag-btn{flex:1;border:none;border-radius:4px;padding:5px 0;font-size:10px;font-weight:700;cursor:pointer;opacity:.25;transition:all .15s;color:#fff;}
.cfo-rag-btn.r{background:#b91c1c;}
.cfo-rag-btn.a{background:#b45309;}
.cfo-rag-btn.g{background:#15803d;}
.cfo-rag-btn.active{opacity:1;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.cfo-note-row{padding:14px 18px;border-top:1px solid var(--border);}
.cfo-note-row label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--navy);display:block;margin-bottom:6px;}
.cfo-note-row textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink);resize:vertical;min-height:60px;box-sizing:border-box;background:var(--surface);}
.cfo-intro{font-size:11.5px;color:var(--muted);padding:12px 18px 10px;line-height:1.6;border-bottom:1px solid var(--border);}
.sum-card-head.cfo-head{background:#002A4E;}
.banner-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.banner-desc{font-size:12.5px;color:var(--navy);line-height:1.6;}
.evp-banner{background:var(--red-light);border-left-color:var(--red);}
.evp-banner .banner-desc{color:#7f1d1d;}
.evp-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.evp-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.06em;}
.evp-head strong{font-size:13px;color:var(--red);}
.evp-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.evp-pill{display:inline-block;white-space:nowrap;background:#fff;color:var(--red);font-size:10.5px;font-weight:500;padding:2px 10px;border-radius:20px;border:1px solid var(--red-mid);flex-shrink:0;}
/* Q TABLE */
.qt{width:100%;border-collapse:collapse;}
.qt thead tr{background:var(--navy-light);border-bottom:1px solid var(--navy-mid);}
.qt th{padding:8px 13px;font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;text-align:left;}
.qt td{padding:13px 13px;font-size:13px;vertical-align:top;border-bottom:1px solid var(--border);}
.qt tr:last-child td{border-bottom:none;}
.qt tr:nth-child(even) td{background:#fafbfc;}
.q-num{display:inline-block;background:var(--navy-light);color:var(--navy);font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px;vertical-align:middle;flex-shrink:0;}.q-text{color:var(--ink);font-weight:500;line-height:1.5;}
.q-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;font-style:italic;}
.resp{color:var(--ink);line-height:1.55;font-size:12.5px;}
.resp.empty{color:#ccc;font-style:italic;}
.pmr-tag{display:inline-block;background:var(--surface);color:var(--ink);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;margin-bottom:3px;}
.pmr-text{font-size:12px;color:#78350f;}
/* INDICATORS */
.indicators{background:#e8f3ff;border-top:2px solid #bfdbfe;border-bottom:2px solid #bfdbfe;overflow:hidden;padding:12px 22px 16px;}
.ind-banner{background:var(--blue);padding:10px 22px;display:flex;align-items:center;gap:8px;}
.ind-banner-title{font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.03em;}
.ind-banner-sub{font-size:11px;color:rgba(255,255,255,.6);}

.ind-title{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ind-emp-badge{background:var(--navy-light);color:var(--navy);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;}
.ind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.ind-item{background:#fff;border-radius:8px;padding:11px 13px;border:.5px solid var(--border);}
.ind-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:3px;}
.ind-desc{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px;}
.ind-target{font-size:10.5px;color:var(--muted);margin-top:5px;}
.sw{display:flex;align-items:center;gap:10px;}
.sw input[type=range]{flex:1;accent-color:var(--navy);}
.kv{font-size:18px;font-weight:600;color:var(--navy);min-width:24px;text-align:center;}
.kv.high{color:var(--green);}
.kv.mid{color:var(--amber);}
.kv.low{color:var(--red);}
/* SELF + MANAGER RATING */
.rating-footer{background:var(--navy-light);border-top:2px solid var(--navy-mid);padding:12px 22px;display:flex;align-items:center;gap:14px;}
.rating-footer label{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;min-width:220px;}
.stars{display:flex;gap:5px;}
.star{font-size:22px;cursor:pointer;color:#d1d5db;transition:color .1s,transform .1s;user-select:none;}
.star:hover,.star.lit{color:var(--amber);}
.star:hover{transform:scale(1.15);}
.rating-note{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 11px;font-size:13px;font-family:Arial,sans-serif;color:var(--ink);outline:none;transition:border-color .15s;}
.rating-note:focus{border-color:var(--blue);}
.rating-guide{padding:8px 22px 10px;background:var(--navy-light);border-top:1px solid var(--navy-mid);font-size:10.5px;color:var(--navy);line-height:1.6;}
.rating-guide-title{font-weight:700;margin-bottom:2px;}
.rating-guide-scale{color:#4b6a8a;}
/* QUESTION SLIDERS */
.q-slider-wrap{display:flex;align-items:center;gap:6px;margin-top:6px;}
.q-slider-wrap input[type=range]{flex:1;accent-color:var(--navy);height:4px;}
.q-slider-wrap input[type=range].emp-range{accent-color:var(--blue);}
.q-slider-wrap input[type=range].mgr-range{accent-color:var(--navy);}
.q-slider-val{font-size:12px;font-weight:700;min-width:18px;text-align:center;}
.q-slider-val.emp-val{color:var(--blue);}
.q-slider-val.mgr-val{color:var(--navy);}
.q-slider-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;}
/* NAV */
.nav-btns{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;background:var(--surface);border-top:1px solid var(--border);}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;font-family:Arial,sans-serif;cursor:pointer;border:none;transition:all .15s;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--surface);color:var(--ink);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:#163a5f;}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:#ED1941;}
.pips{display:flex;gap:4px;}
.pip{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .2s;}
.pip.done{background:var(--amber);}
.pip.cur{background:var(--blue);}
/* SUMMARY */
.sum-hdr{background:var(--navy);border-radius:var(--radius);padding:22px 26px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;width:100%;}
.sum-hdr h1{font-family:Arial,sans-serif;font-size:18pt;font-weight:700;color:#fff;}
.sum-hdr .meta{font-size:13px;color:rgba(255,255,255,.5);margin-top:3px;}
.sum-overall-stars{font-size:22px;color:var(--amber);}
.sum-overall-label{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px;text-align:right;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;width:100%;}
.stat-card{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);text-align:center;}
.stat-val{font-family:Arial,sans-serif;font-size:22pt;font-weight:700;color:var(--navy);}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}
.sum-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;width:100%;}
.sum-card-head{background:var(--navy);padding:11px 18px;}
.sum-card-head h3{font-size:12px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.07em;}
.prev-grid{display:grid;grid-template-columns:repeat(2,1fr);}
.prev-item{padding:14px 16px;border-right:.5px solid var(--border);text-align:center;}
.prev-item:last-child{border-right:none;}
.prev-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.prev-vals{display:flex;align-items:center;justify-content:center;gap:8px;}
.prev-val{font-family:Arial,sans-serif;font-size:18pt;font-weight:700;color:var(--navy);}
.prev-val.old{color:#d1d5db;font-size:20px;}
.prev-arrow{font-size:14px;color:var(--muted);}
.prev-arrow.up{color:var(--green);}
.prev-arrow.down{color:var(--red);}
.prev-change{font-size:11px;color:var(--muted);margin-top:3px;}
.prev-change.up{color:var(--green);}
.prev-change.down{color:var(--red);}
.prev-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px;border-top:.5px solid var(--border);background:var(--surface);}
.prev-input-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
.prev-input{border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:13px;font-family:Arial,sans-serif;color:var(--ink);outline:none;width:100%;text-align:center;transition:border-color .15s;}
.prev-input:focus{border-color:var(--blue);}
.sum-table{width:100%;border-collapse:collapse;}
.sum-table th{background:var(--navy-light);color:var(--navy);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;text-align:left;}
.sum-table td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.sum-table tr:last-child td{border-bottom:none;}
.sum-table tr:nth-child(even) td{background:#fafbfc;}
.sum-table .overall-row td{background:var(--navy-light) !important;font-weight:700;}
.sec-name{font-weight:600;color:var(--navy);font-size:13px;}
.no-rating{color:#d1d5db;font-size:12px;font-style:italic;}
.sum-note{color:var(--muted);font-size:12px;font-style:italic;}
.kpi-sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 18px;width:100%;}
.kpi-sum-item{background:var(--surface);border-radius:8px;padding:11px 13px;border:.5px solid var(--border);}
.kpi-sum-name{font-size:12px;font-weight:600;color:var(--ink);}
.kpi-sum-val{font-size:20px;font-weight:600;color:var(--navy);margin-top:4px;}
.kpi-sum-val.high{color:var(--green);}
.kpi-sum-val.mid{color:var(--amber);}
.kpi-sum-val.low{color:var(--red);}
.kpi-sum-label{font-size:11px;color:var(--muted);margin-top:2px;}
.act-table{width:100%;border-collapse:collapse;}
.act-table th{background:var(--red);color:#fff;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;text-align:left;}
.act-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.act-table tr:last-child td{border-bottom:none;}
.act-table tr:nth-child(even) td{background:#fafbfc;}
.act-num{width:28px;height:28px;background:var(--red-light);color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.owner-tag{display:inline-block;background:var(--navy-light);color:var(--navy);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;}
.date-tag{display:inline-block;background:#ecfdf5;color:var(--ink);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;}
.tbd{color:#d1d5db;font-size:12px;font-style:italic;}
.inline-in{border:none;border-bottom:1px solid var(--border);outline:none;font-family:Arial,sans-serif;font-size:13px;padding:2px 4px;width:100%;color:var(--ink);background:transparent;}
.signoff-grid{display:grid;grid-template-columns:1fr 1fr;}
.signoff-col{padding:18px 22px;border-right:1px solid var(--border);}
.signoff-col:last-child{border-right:none;}
.signoff-col label{font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:10px;}
.sig-line{border-bottom:2px solid var(--border);height:38px;display:flex;align-items:flex-end;padding-bottom:5px;color:#bbb;font-style:italic;font-size:14px;margin-bottom:5px;}
.sig-name{font-size:12px;color:var(--muted);}
.signoff-dates{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);}
.signoff-date{padding:12px 22px;font-size:13px;border-right:1px solid var(--border);}
.signoff-date:last-child{border-right:none;}
.signoff-date strong{color:var(--navy);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transform:translateY(6px);transition:all .22s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateY(0);}
.refl-item{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;background:var(--surface);border-radius:8px;border:.5px solid var(--border);}
.refl-check{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.refl-check.checked{background:#7e22ce;border-color:#7e22ce;}
.refl-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}


.refl-text{font-size:13px;color:var(--ink);line-height:1.5;flex:1;}
.refl-sub{font-size:11.5px;color:var(--muted);margin-top:3px;}
.rtag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;margin-right:6px;}
.rt-good{background:var(--surface);color:var(--ink);}
.rt-watch{background:var(--surface);color:var(--ink);}
.rt-act{background:var(--surface);color:var(--ink);}
/* =============================================
   2026 GOALS PAGE — FULL REDESIGN
   ============================================= */

/* Outer wrapper — full card */
.gp-card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07),0 8px 32px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px;}

/* ---- HERO: split layout ---- */
.gp-hero{min-height:180px;}
.gp-hero-left{background:var(--navy);padding:40px 44px 40px;position:relative;overflow:hidden;}
/* Geometric accent circles */
.gp-hero-left::before{content:'';position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;border:40px solid rgba(255,255,255,.04);pointer-events:none;}
.gp-hero-left::after{content:'';position:absolute;left:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(192,39,45,.15);pointer-events:none;}
.gp-hero-right{background:var(--red);padding:40px 36px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.gp-hero-right::before{content:'';position:absolute;right:-50px;bottom:-50px;width:200px;height:200px;border-radius:50%;background:rgba(0,0,0,.1);pointer-events:none;}

/* Left content */
.gp-wordmark{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
.gp-wordmark-bar{width:3px;height:28px;background:var(--red);border-radius:2px;flex-shrink:0;}
.gp-wordmark-text{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);line-height:1.3;}
.gp-wordmark-text span{display:block;font-size:13px;color:rgba(255,255,255,.85);letter-spacing:.06em;}
.gp-year-tag{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:3px 10px;border-radius:4px;margin-bottom:12px;}
.gp-hero-title{font-size:36pt;font-weight:700;color:#fff;letter-spacing:-.8px;line-height:1.0;margin-bottom:8px;}
.gp-hero-sub{font-size:13px;color:rgba(255,255,255,.45);line-height:1.55;max-width:340px;}
.gp-hero-sub strong{color:rgba(255,255,255,.75);}

/* Right panel — stat block */
.gp-stat-block{position:relative;z-index:1;}
.gp-stat-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.55);margin-bottom:6px;}
.gp-stat-num{font-size:52pt;font-weight:700;color:#fff;letter-spacing:-2px;line-height:1.0;}
.gp-stat-label{font-size:13px;color:rgba(255,255,255,.7);margin-top:2px;line-height:1.4;}
.gp-markets{margin-top:20px;display:flex;flex-direction:column;gap:5px;position:relative;z-index:1;}
.gp-market{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.75);}
.gp-market::before{content:'';width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.6);flex-shrink:0;}

/* ---- GOALS GRID ---- */
.gp-goals-wrap{padding:32px 40px 28px;background:var(--surface);}
.gp-goals-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.gp-goals-heading{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);}
.gp-goals-count{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:20px;padding:2px 10px;}

.gp-goals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.gp-goals-grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

.gp-goal{background:#fff;border-radius:10px;border:1px solid var(--border);padding:18px 16px 16px;display:flex;flex-direction:column;gap:0;transition:all .15s;cursor:default;position:relative;overflow:hidden;border-top-width:3px;}
.gp-goal:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);transform:translateY(-1px);}
.gp-goal::after{display:none;}
.gp-goal.g-people{border-color:var(--red-mid);background:#fff;}
.gp-goal.g-people::after{background:var(--red);opacity:1;}

.gp-num{width:36px;height:36px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#ffffff;margin-bottom:12px;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.2);}
.gp-goal.g-people .gp-num{background:var(--red);}

.gp-goal-n{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px;}
.gp-goal-title{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.45;flex:1;}
.gp-goal.g-people .gp-goal-title{color:var(--red);}
.gp-goal-tag{display:inline-block;margin-top:8px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;background:var(--red-light);color:var(--red);}

/* ---- VISION BANNER ---- */
.gp-vision{background:var(--navy);margin:0;padding:24px 40px;display:flex;align-items:center;gap:24px;}
.gp-vision-left{display:flex;flex-direction:column;gap:3px;min-width:160px;}
.gp-vision-logo-line{font-size:14px;font-weight:700;color:#fff;line-height:1.2;}
.gp-vision-logo-line sup{font-size:8px;vertical-align:super;}
.gp-vision-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);margin-top:2px;}
.gp-vision-divider{width:1px;background:rgba(255,255,255,.15);align-self:stretch;min-height:40px;}
.gp-vision-quote-wrap{flex:1;}

function setCfo(id,field,val){
  if(!S.cfo)S.cfo={};
  if(!S.cfo[id])S.cfo[id]={target:'',actual:'',rag:'',note:''};
  S.cfo[id][field]=val;
  // Auto-calculate RAG when both target and actual are filled
  if(field==='target'||field==='actual'){
    const t=parseFloat((S.cfo[id].target||'').replace(/[^0-9.-]/g,''));
    const a=parseFloat((S.cfo[id].actual||'').replace(/[^0-9.-]/g,''));
    if(!isNaN(t)&amp;&amp;!isNaN(a)&amp;&amp;t!==0){
      const lowerIsBetter=['debtors','opex'];
      const pct=a/t;
      let autoRag;
      if(lowerIsBetter.includes(id)){
        // Lower actual = better: ≤100% is green, 100-120% is amber, >120% is red
        autoRag=pct<=1?'g':pct<=1.2?'a':'r';
      } else {
        // Higher actual = better: ≥100% is green, 80-99% is amber, <80% is red
        autoRag=pct>=1?'g':pct>=0.8?'a':'r';
      }
      S.cfo[id].rag=autoRag;
      const btns=document.querySelectorAll(`#cfo-${id} .cfo-rag-btn`);
      btns.forEach(b=>b.classList.toggle('active',b.classList.contains(autoRag)));
    }
  }
  autosave();
}

function loadState(){
  try{
    if(window.EXPORTED_STATE){
      Object.keys(window.EXPORTED_STATE).forEach(k=>{if(k in S) S[k]=window.EXPORTED_STATE[k];});
      return;
    }
    const saved=localStorage.getItem(LS_KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      Object.keys(parsed).forEach(k=>{if(k in S) S[k]=parsed[k];});

function exportForSharing(){
  // Save current avg to trend history before export
  try{
    const scores=SECTIONS.map((_,i)=>(S.ratings[i]||{}).stars||0).filter(x=>x>0);
    const kpiS=(S.ratings['kpi']||{}).stars||0;
    const total=scores.length+(kpiS>0?1:0);
    if(total>0){
      const avg=((scores.reduce((a,b)=>a+b,0)+kpiS)/total).toFixed(1);
      if(!S.trendHistory) S.trendHistory=[];
      const wbScore=calcWellbeingScore();
      S.trendHistory.push({avg:avg,date:new Date().toLocaleDateString('en-GB'),wb:wbScore});
      // Carry forward open/missed actions
      const openActions=(S.actions||[]).filter(function(a){return a.text&amp;&amp;a.status!=='done';});
      if(openActions.length) S.carryForward=openActions.map(function(a){return {text:a.text,ownerType:a.ownerType||'',date:a.date||'',status:'open',source:'Carried forward'};});
      if(S.trendHistory.length>3) S.trendHistory.shift();
    }
  }catch(ex){}

  try{
    const stateJson=JSON.stringify(S).replace(/<\/script>/gi,'<\\/script>');
    const html=document.documentElement.outerHTML;
    const stateScript='<'+'script>window.EXPORTED_STATE='+stateJson+';<'+'/script>';
    const injected=html.replace('</head>',stateScript+'</head>');
    const blob=new Blob([injected],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='SDI_121_Review_'+((S.meta&amp;&amp;S.meta.empName?S.meta.empName.replace(/\s+/g,'_'):'Employee'))+'.html';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('✓ Exported — ready to share');
  }catch(e){alert('Export failed. Please try again.');console.error(e);}
}

function fmtKpi(v){
  if(!v)return v;
  const prefix=v.match(/^[£$€%]*/)?.[0]||'';
  const num=v.replace(/[^0-9.]/g,'');
  if(!num)return v;
  const parts=num.split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return prefix+parts.join('.');
}
function stripKpi(v){return v?v.replace(/,/g,''):v;}

function getTrendLight(avg){

function buildTrend(){
  const el=document.getElementById('sum-trend');
  if(!el) return;
  const history=S.trendHistory||[];
  const scores=SECTIONS.map((_,i)=>(S.ratings[i]||{}).stars||0).filter(x=>x>0);
  const kpiRated=(S.ratings['kpi']||{}).stars>0?1:0;
  const rated=scores.length+kpiRated;
  const avgScore=rated?(scores.reduce((a,b)=>a+b,0)+((S.ratings['kpi']||{}).stars||0))/(rated):null;
  const current=avgScore?parseFloat(avgScore.toFixed(1)):null;
  
  // Build display — up to 3 past + current
  let html='<div style=&quot;display:flex;align-items:center;gap:16px;flex-wrap:wrap;&quot;>';
  
  // Past reviews
  history.slice(-3).forEach(function(h,i){
    const t=getTrendLight(h.avg);
    if(!t) return;
    html+='<div style=&quot;text-align:center;&quot;>'
      +'<div style=&quot;font-size:28px;&quot;>'+t.light+'</div>'
      +'<div style=&quot;font-size:10px;color:var(--muted);margin-top:3px;&quot;>Review '+(i+1)+'</div>'
      +'<div style=&quot;font-size:10px;font-weight:700;color:'+t.col+';&quot;>'+h.avg+'/5</div>'
      +'</div>';
    if(i<history.slice(-3).length-1||current){
      html+='<div style=&quot;font-size:18px;color:#d1d5db;&quot;>→</div>';
    }
  });
  
  // Current review
  if(current){
    const t=getTrendLight(current);
    html+='<div style=&quot;text-align:center;background:#f0f4fa;border-radius:8px;padding:8px 14px;&quot;>'
      +'<div style=&quot;font-size:28px;&quot;>'+t.light+'</div>'
      +'<div style=&quot;font-size:10px;color:var(--muted);margin-top:3px;&quot;>This review</div>'
      +'<div style=&quot;font-size:11px;font-weight:700;color:'+t.col+';&quot;>'+current+'/5</div>'
      +'</div>';
  } else {
    html+='<div style=&quot;font-size:12px;color:var(--muted);font-style:italic;&quot;>Rate sections to see trend</div>';
  }
  
  if(!history.length&amp;&amp;!current){
    html='<div style=&quot;font-size:12px;color:var(--muted);font-style:italic;&quot;>Trend builds automatically across reviews as you export each one.</div>';
  }
  
  html+='</div>';
  el.innerHTML=html;
}

function calcWellbeingScore(){
  // Q1.1-1.5 are section 0 (si=0), rows 0-4
  // emoji values: struggling=1, good=2, great=3
  // yn%: great=3(yes=good), struggling=1(no=bad) for Q1.4 (managing hours)
  // notgreat: struggling=1, good=2, great=3
  // meaningful: struggling=1, good=2, great=3
  const vals=[];
  for(let ri=0;ri<5;ri++){
    const key='0_'+ri;
    const qr=(S.qratings||{})[key]||null;
    if(qr){
      const score=qr==='struggling'?1:qr==='good'?2:qr==='great'?3:null;
      if(score) vals.push(score);
    }
  }
  if(!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
}

function getWellbeingBand(score){
  const v=parseFloat(score);
  if(v<1.5) return {light:'🔴',label:'Low — needs attention',col:'#dc2626',bg:'#fee2e2'};
  if(v<2.5) return {light:'🟡',label:'Moderate — worth monitoring',col:'#d97706',bg:'#fef3c7'};
  return {light:'🟢',label:'Good — healthy',col:'#16a34a',bg:'#dcfce7'};
}

function calcReflScore(){
  const el=document.getElementById('refl-score');
  if(!el) return;
  const rs=S.reflSelf||{};
  const vals=REFL_SELF.map(function(q){
    const v=rs[q.id];
    if(!v) return null;
    return v==='great'?3:v==='good'?2:1;
  }).filter(function(v){return v!==null;});
  if(!vals.length){el.innerHTML='';return;}
  const avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
  const pct=((avg-1)/2)*100;
  const col=avg>=2.5?'#16a34a':avg>=1.5?'#d97706':'#dc2626';
  const lbl=avg>=2.5?'Strong conversation':avg>=1.5?'Good, room to improve':'Needs reflection';
  el.innerHTML='<div style=&quot;margin-top:14px;padding:12px 16px;background:#f4f8fc;border-radius:8px;border-left:3px solid '+col+';&quot;>'
    +'<div style=&quot;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;&quot;>'

    +'</div>';

function setRating(si,val){
  if(!S.ratings[si])S.ratings[si]={stars:0,note:'',selfStars:0,selfNote:''};
  S.ratings[si].stars=S.ratings[si].stars===val?0:val;
  document.querySelectorAll(`.star[data-si=&quot;${si}&quot;]`).forEach(el=>el.classList.toggle('lit',parseInt(el.dataset.v)<=S.ratings[si].stars));
  SECTIONS.forEach((_,i)=>renderPips(i));
  buildSidebar();buildHome();
  toast(`${SECTIONS[si].title} rated ${S.ratings[si].stars>0?S.ratings[si].stars+'/5':'cleared'}`);
  autosave();
}

// SUMMARY
function buildSummary(){
  const scores=SECTIONS.map((_,i)=>(S.ratings[i]||{}).stars||0).filter(x=>x>0);
  const rated=scores.length;
  const overall=rated?Math.round(scores.reduce((a,b)=>a+b,0)/rated):0;
  const avgScore=rated?(scores.reduce((a,b)=>a+b,0)/rated).toFixed(1):null;

  const kpiRated=(S.ratings['kpi']||{}).stars>0?1:0;
  document.getElementById('stat-rated').textContent=`${rated+kpiRated}/${SECTIONS.length+1}`;
  const shEl=document.getElementById('stat-happy');if(shEl)shEl.innerHTML=dominantEmoji('happy');
  const seEl=document.getElementById('stat-energy');if(seEl)seEl.innerHTML=dominantEmoji('energy');
  document.getElementById('sum-stars').innerHTML=stH(overall,20);

  // Section table — with previous rating input and trend
  const trendIcon=(prev,curr)=>{
    if(!prev||!curr) return '<span style=&quot;color:#d1d5db;font-size:13px;&quot;>—</span>';
    if(curr>prev) return `<span style=&quot;color:var(--green);font-size:15px;font-weight:700;&quot;>↑</span><span style=&quot;font-size:11px;color:var(--green);margin-left:3px;&quot;>+${curr-prev}</span>`;
    if(curr<prev) return `<span style=&quot;color:var(--red);font-size:15px;font-weight:700;&quot;>↓</span><span style=&quot;font-size:11px;color:var(--red);margin-left:3px;&quot;>${curr-prev}</span>`;
    return '<span style=&quot;color:var(--muted);font-size:13px;&quot;>→</span>';
  };
  const prevStarsHtml=(si)=>{
    const pv=S.prevRatings[si]||0;
    let h='<div style=&quot;display:flex;gap:3px;&quot;>';
    for(let i=1;i<=5;i++) h+=`<span style=&quot;font-size:16px;cursor:pointer;color:${i<=pv?'#a855f7':'#cdd9e6'};transition:color .1s;&quot; onclick=&quot;setPrevRating(${si},${i})&quot; title=&quot;Set last review rating to ${i}&quot;>★</span>`;
    h+='</div>';
    if(pv>0) h+=`<div style=&quot;font-size:10px;color:#a855f7;margin-top:2px;&quot;>${pv}/5 last review</div>`;
    else h+=`<div style=&quot;font-size:10px;color:#d1d5db;margin-top:2px;&quot;>Click to set</div>`;
    return h;
  };

  document.getElementById('sum-tbody').innerHTML=
    SECTIONS.map((s,i)=>{
      const r=S.ratings[i]||{};
      const pv=S.prevRatings[i]||0;
      const cv=r.stars||0;
      const kr=S.ratings['kpi']||{};
      const kcv=kr.stars||0;
      const kpiRow=i===3?`<tr><td><span class=&quot;sec-name&quot;>📊 Key Performance Indicators</span></td><td><div style=&quot;font-size:10px;color:#d1d5db;&quot;>—</div></td><td>${kcv>0?stH(kcv):'<span class=&quot;no-rating&quot;>Not rated</span>'}</td><td style=&quot;text-align:center;&quot;>—</td><td>${kr.note?'<span class=&quot;sum-note&quot;>'+esc(kr.note)+'</span>':'<span class=&quot;no-rating&quot;>No notes</span>'}</td></tr>`:'';
      return kpiRow+`<tr>
        <td><span class=&quot;sec-name&quot;>${i<4?i+1:i+2}. ${s.icon} ${s.title}</span></td>
        <td>${prevStarsHtml(i)}</td>
        <td>${cv>0?stH(cv):'<span class=&quot;no-rating&quot;>Not rated</span>'}</td>
        <td style=&quot;text-align:center;&quot;>${trendIcon(pv||null, cv||null)}</td>
        <td>${r.note?`<span class=&quot;sum-note&quot;>${r.note}</span>`:'<span class=&quot;no-rating&quot;>No notes</span>'}</td>
      </tr>`;
    }).join('')+
    `<tr class=&quot;overall-row&quot;>
      <td><span class=&quot;sec-name&quot; style=&quot;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;&quot;>Overall Manager Rating</span></td>
      <td>${Object.keys(S.prevRatings).length>0?stH(Math.round(Object.values(S.prevRatings).reduce((a,b)=>a+b,0)/Object.values(S.prevRatings).length)):'<span class=&quot;no-rating&quot;>—</span>'}</td>
      <td>${overall>0?stH(overall):'<span class=&quot;no-rating&quot;>—</span>'}</td>
      <td style=&quot;text-align:center;&quot;>${(()=>{const p=Object.values(S.prevRatings);const prevAvg=p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):0;return trendIcon(prevAvg||null,overall||null);})()}</td>
      <td></td>
      <td>${avgScore?(()=>{
        const av=parseFloat(avgScore);
        const lbl=av<2?'Needs attention':av<3?'Below expectations':av<4?'Meeting expectations':av<5?'Exceeding':'Outstanding';
        const col=av<2?'#991b1b':av<3?'#92400e':av<4?'#065f46':'#1e40af';
        const bg=av<2?'#fee2e2':av<3?'#fef3c7':av<4?'#d1fae5':'#dbeafe';
        return `<div style=&quot;display:flex;align-items:center;gap:8px;justify-content:flex-end;&quot;><span style=&quot;font-size:14px;font-weight:700;color:var(--ink);&quot;>Avg ${avgScore}/5</span><span style=&quot;background:${bg};color:${col};border-radius:99px;padding:3px 10px;font-size:10.5px;font-weight:700;white-space:nowrap;&quot;>${lbl}</span></div>`;
      })():''}</td>
    </tr>
    <tr><td colspan=&quot;6&quot; style=&quot;padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:var(--surface);&quot;><span style=&quot;font-weight:600;color:var(--ink);&quot;>Rating guide:</span> &amp;nbsp;<span style=&quot;color:#f59e0b;font-weight:700;&quot;>★</span> 1 Needs attention &amp;nbsp;·&amp;nbsp; <span style=&quot;color:#f59e0b;font-weight:700;&quot;>★★</span> 2 Below expectations &amp;nbsp;·&amp;nbsp; <span style=&quot;color:#f59e0b;font-weight:700;&quot;>★★★</span> 3 Meeting expectations &amp;nbsp;·&amp;nbsp; <span style=&quot;color:#f59e0b;font-weight:700;&quot;>★★★★</span> 4 Exceeding &amp;nbsp;·&amp;nbsp; <span style=&quot;color:#f59e0b;font-weight:700;&quot;>★★★★★</span> 5 Outstanding</td></tr>`;

  // KPI summary
  let kh=`<div style=&quot;padding:12px 18px 4px;font-size:12px;color:var(--muted);line-height:1.5;&quot;>Emoji selections across all 8 sections. A dip in a specific section is often more informative than the overall average.</div><div class=&quot;kpi-sum-grid&quot;>`;
  KPIS.forEach(k=>{
    const c=countEmoji(k.id);const total=c.struggling+c.good+c.great;
    const dominant=c.great>=c.good&amp;&amp;c.great>=c.struggling?'great':c.good>=c.struggling?'good':'struggling';
    const cls=total===0?'':dominant==='great'?'high':dominant==='good'?'mid':'low';
    kh+=`<div class=&quot;kpi-sum-item&quot;><div class=&quot;kpi-sum-name&quot;>${k.name}</div>
    <div style=&quot;display:flex;gap:10px;margin:8px 0;flex-wrap:wrap;&quot;>
      ${c.struggling?'<span style=&quot;background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;&quot;>😔 '+c.struggling+' Struggling</span>':''}
      ${c.good?'<span style=&quot;background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;&quot;>🙂 '+c.good+' Good</span>':''}
      ${c.great?'<span style=&quot;background:var(--surface);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;&quot;>😊 '+c.great+' Great</span>':''}
      ${!total?'<span style=&quot;color:#d1d5db;font-size:12px;&quot;>Not completed</span>':''}
    </div>
    <div class=&quot;kpi-sum-label&quot;>${k.target}</div></div>`;
  });
  kh+=`</div><div style=&quot;padding:0 18px 16px;&quot;><div style=&quot;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px;&quot;>Section breakdown</div>
      <table style=&quot;width:100%;border-collapse:collapse;font-size:12px;&quot;>
        <thead><tr>
          <th style=&quot;text-align:left;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--muted);&quot;>Section</th>
          ${KPIS.map(k=>'<th style=&quot;text-align:center;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--muted);&quot;>'+k.name+'</th>').join('')}
        </tr></thead>
        <tbody>
          ${(()=>{
            const cell=(v)=>{const em=v===1?'😔':v===3?'🙂':v===5?'😊':null;const bg=v===1?'var(--surface)':v===3?'var(--surface)':v===5?'var(--surface)':'transparent';const tc='var(--ink)';return '<td style=&quot;text-align:center;padding:4px 8px;border-bottom:1px solid var(--border);&quot;>'+(em?'<span style=&quot;background:'+bg+';color:'+tc+';border-radius:99px;padding:2px 10px;font-size:14px;&quot;>'+em+'</span>':'<span style=&quot;color:#d1d5db;&quot;>—</span>')+'</td>';};
            const dashCells=KPIS.map(function(k){return cell(S.wb[k.id+'_kpi']||0);}).join('');
            let rows='';
            SECTIONS.forEach((sec,si)=>{
              if(si===3) rows+='<tr><td style=&quot;padding:6px 10px;border-bottom:1px solid var(--border);font-weight:500;&quot;>5. 📊 Key Performance Indicators</td>'+dashCells+'</tr>';
              rows+='<tr><td style=&quot;padding:6px 10px;border-bottom:1px solid var(--border);font-weight:500;&quot;>'+(si<4?si+1:si+2)+'. '+sec.icon+' '+sec.title+'</td>'+KPIS.map(k=>cell(S.wb[k.id+'_'+si]||0)).join('')+'</tr>';
            });
            return rows;
          })()}
        </tbody>
      </table>
    </div>`;
  document.getElementById('kpi-sum').innerHTML=kh;

  buildTrend();
  buildWellbeingScore();
  buildCarryForward();
  // Manager commitment
  const cmtEl=document.getElementById('sum-commitment');
  if(cmtEl) cmtEl.textContent=S.mgrCommitment||'No commitment recorded yet.';
  // Actions
  buildActions();

  refreshPrev();
}

function upPrev(id,val,max){S.prev[id]=parseFloat(val);refreshPrev();autosave();}
function refreshPrev(){
  const domVal={struggling:1,good:2,great:3};
  KPIS.forEach(k=>{
    const nE=document.getElementById('pvn-'+k.id);
    const aE=document.getElementById('pa-'+k.id);
    const cE=document.getElementById('pc-'+k.id);
    const oE=document.getElementById('pvo-'+k.id);
    if(!nE)return;
    nE.innerHTML=dominantEmoji(k.id);
    nE.style.fontSize='12px';
    const prev=S.prev?S.prev[k.id]:null;
    const c=countEmoji(k.id);
    const total=c.struggling+c.good+c.great;
    const curr=total===0?null:c.great>=c.good&amp;&amp;c.great>=c.struggling?'great':c.good>=c.struggling?'good':'struggling';
    if(oE) oE.innerHTML=prev?'<span style=&quot;font-size:13px;font-weight:600;&quot;>'+{struggling:'😔 Struggling',good:'🙂 Good',great:'😊 Great'}[prev]+'</span>':'<span style=&quot;color:#d1d5db;font-size:11px;&quot;>Not set</span>';
    if(prev&amp;&amp;curr){
      const pv=domVal[prev],cv=domVal[curr];
      if(cv>pv){aE.textContent='↑';aE.className='prev-arrow up';}
      else if(cv<pv){aE.textContent='↓';aE.className='prev-arrow down';}
      else{aE.textContent='→';aE.className='prev-arrow';}
      cE.textContent=cv>pv?'Improved':cv<pv?'Declined':'No change';
      cE.className='prev-change'+(cv>pv?' up':cv<pv?' down':'');
    } else {
      aE.textContent='→';aE.className='prev-arrow';
      cE.textContent='';cE.className='prev-change';
    }
  });
  buildCfoKpis();
}

    <div class=&quot;part-divider&quot;><span class=&quot;part-divider-bar&quot;></span><span class=&quot;part-divider-text&quot;>Welcome</span><span class=&quot;part-divider-rule&quot;></span></div>

    <!-- 1. WELCOME -->
    <div class=&quot;sec-card&quot; id=&quot;s1&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>1</span> Welcome</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Welcome to SDI. We operate at the intersection of the human and digital age and the people who make that possible are our greatest asset. You have joined a team that exists to Surprise, Delight and Inspire and that starts with how we treat each other. Every person here contributes to something bigger than their job title, and we are genuinely excited to have you with us.</p>
        <p>As an SDI employee you will be expected to live our brand philosophies of Surprise, Delight and Inspire (SDI) and Discover, Pioneer, Inspire (DPI), ensuring every interaction with every customer delivers our brand promise of exceptional, fun and inspirational experiences.</p>
        <p>This handbook is your guide to how we work, what we ask of you, and what you can always expect from us in return. Unless your Letter of Engagement states otherwise, these policies are not part of your contract of employment, but they do apply to everyone, and we ask you to follow them.</p>
        <p>We review and update this handbook annually. The current version is always on SharePoint so please make sure yours is up to date.</p>
        <p>On joining SDI, you will be asked to sign to confirm you have received, read, and understood this handbook. A signed acknowledgement form will be kept on your employment file. Signing the form confirms receipt and understanding &amp;mdash; it does not make the handbook contractual.</p>
        <h3>Leadership structure</h3>

    <div class=&quot;sec-card&quot; id=&quot;s2&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>2</span> Absence</h2></div>
      <div class=&quot;sec-intro&quot;>We care about your health and wellbeing. This section explains what to do if you are unwell and unable to work.</div>
      <div class=&quot;sec-body&quot;>
        <h3>Disabilities</h3>
        <p>You are not legally required to disclose a disability to us. However, if you do have a condition that may affect your work, we encourage you to let us know in confidence. This allows us to consider any reasonable adjustments that may help you. You do not need to share a diagnosis. Any information that helps us understand your needs is enough. We will never penalise you for choosing not to disclose.</p>
        <h3>How to report an absence</h3>
        <p>We understand that being unwell can make it difficult to follow a process. Where you can, please call your line manager personally by phone before your normal start time on your first day of absence. Please do not use text messages or social media unless there is genuinely no alternative. If you are too unwell to call, please ask someone to contact us on your behalf. If no contact is possible straight away, please reach out as soon as you reasonably can.</p>
        <p>When you do make contact, please tell us why you are absent, when you expect to return, and flag any urgent work that needs attention. If you are still absent after day one, keep your line manager updated by 9am each day.</p>
        <h3>Certificates and fit notes</h3>
        <p>For absences of seven calendar days or fewer (counting weekends and non-working days), complete the SDI Self-Certification Form (available on SharePoint) when you return and give it to your line manager. If your absence continues beyond seven calendar days, you must provide a fit note covering your absence from the eighth day onwards. A fit note (a Statement of Fitness for Work) can be issued by a GP, hospital doctor, registered nurse, pharmacist, physiotherapist or occupational therapist. Send it to your line manager as soon as you receive it, and provide a further fit note to cover any continued absence so that no period is left uncertified. If you do not provide the required medical evidence, any sick pay (including SSP) may be withheld for the uncertified period, and the absence may be treated as unauthorised and managed under our absence and disciplinary procedures.</p>
        <p>A fit note may say you are fit for work with adjustments such as a phased return, altered hours, or amended duties. We will consider any such recommendation and discuss options with you. If we cannot make the suggested adjustment, we will explain why and agree a review date. In that case we will treat the fit note as if it said you are not fit for work.</p>
        <h3>Independent medical examination</h3>
        <p>We may ask you, at our expense, to be assessed by an independent doctor. Refusing without good reason may lead to disciplinary action. Where necessary, we may also request a medical report from your own GP or consultant under the Access to Medical Reports Act 1988. We will explain your rights and obtain your written consent before doing so.</p>
        <h3>Holiday during sickness</h3>
        <p>If you want to take holiday while you are off sick, you must book it in the usual way and obtain your GP's agreement. Sick pay will not be paid during any period recorded as holiday. Any unused holiday entitlement that could not be taken because of long term sickness may be carried over, subject to statutory rules.</p>
        <h3>Sick pay</h3>
        <p>We know that being unwell is stressful enough without worrying about money. Here is a clear explanation of what you will be paid if you are off sick.</p>
        <p>To qualify for Statutory Sick Pay (SSP), you must have notified your line manager before your normal start time on the first day of absence.</p>
        <p>SSP is currently paid from day one of absence and for a maximum of 28 weeks.</p>
        <h4>During your probationary period</h4>
        <p>During probation, the company does not pay company sick pay. You may be entitled to Statutory Sick Pay (SSP), which is the government minimum. SSP currently starts from your first day of absence. Please speak to your line manager if you are unsure what this means for you.</p>
        <h4>After your probationary period</h4>
        <p>Once you have passed probation, if you are off sick the company will support you as follows, for up to 13 weeks in any rolling 12-month period:</p>
        <ul>
          <li>Weeks 1 to 6: you will receive your full normal salary.</li>
          <li>Weeks 7 to 13: you will receive half your normal salary.</li>
        </ul>
        <p>In both cases, any SSP you are entitled to is included within these payments. You will not receive less than the figures above.</p>
        <h4>Beyond 13 weeks</h4>
        <p>If you are absent for more than 13 weeks, company sick pay stops and you will receive SSP only, for as long as you remain eligible under government rules. Any payment beyond this is entirely at the company's discretion.</p>
        <h4>What is a rolling 12 month period?</h4>
        <p>This means the 13-week entitlement is not fixed to a calendar year. For example, if you used 8 weeks of sick pay in October, you would have 5 weeks remaining until the following October, when those earlier weeks begin to fall away and your entitlement gradually rebuilds.</p>
        <p>If you are ever unsure about your sick pay position, please speak to your line manager or a member of the leadership team. We would always rather you asked than worried.</p>
        <h3>Long term or persistent absence</h3>
        <p>We will be as supportive as we can if you are seriously or long term ill. However, if absence continues for an extended period or follows a pattern of concern, we may need to consider changes to your role or, as a last resort, the ending of your employment. We will always follow a fair process and give you the opportunity to discuss the situation.</p>
        <h3>Arriving late or leaving early</h3>
        <p>If travel disruption prevents you arriving on time or staying for your full shift, contact your line manager as soon as possible. Depending on the circumstances, your manager may agree one of the following:</p>
        <ul>
          <li>Make up the time on another day.</li>
          <li>Use annual leave.</li>
          <li>Take unpaid leave (pay adjusted accordingly).</li>
          <li>Be paid as normal.</li>
          <li>Work from home.</li>
        </ul>
        <h3>Jury service and public duties</h3>
        <p>Notify us as soon as you receive a jury summons. Leave will normally be granted. There is no contractual entitlement to full pay during jury service, however any allowances paid to you by the court must be declared so they can be offset against any discretionary pay we award.</p>
        <p>Please ensure this absence is recorded in Timetastic by you or your line manager immediately.</p>
        <h3>Reserve Armed Forces</h3>
        <p>You may use your paid annual leave for reserve duties. Any additional time off is unpaid and at the company's discretion.</p>
        <p>We value the commitment and skills that reservists bring to their work and to the company.</p>
        <p>Please ensure this absence is recorded in Timetastic by you or your line manager immediately.</p>
        <h3>Medical appointments</h3>
        <p>Wherever possible, please schedule appointments outside working hours or at the start or end of the day. All appointments must be pre-approved by your line manager and should not exceed two hours. Pay during attendance at such appointments is at the company's discretion.</p>
        <p>Please ensure this absence is recorded in Timetastic by you or your line manager immediately.</p>
        <h3>Dependant emergencies</h3>
        <p>You have the right to reasonable unpaid time off to deal with an unexpected emergency involving someone who depends on you (for example, a child, partner, or elderly relative). Examples include:</p>
        <ul>
          <li>Sudden illness, injury, or assault involving a dependant.</li>
          <li>Breakdown of care arrangements.</li>
          <li>Death of a dependant.</li>
          <li>An unexpected incident involving a child at school.</li>
        </ul>
        <p>Call your line manager personally before the start of your shift, explain the situation, and give an expected return date.</p>
        <h3>Behaviour while absent</h3>
        <p>We ask that while you are absent, you focus on your recovery. Please avoid activities that could delay your return to health, such as working for another employer or undertaking physical activity that is inconsistent with your reason for absence. We want you back when you are genuinely well.</p>
        <h3>Return to work meetings</h3>
        <p>After any absence, your line manager will usually hold a brief return to work meeting to check you are fit to return, understand the reason for absence, and agree any support needed. If you are taking medication that could affect your ability to work safely, please mention it at this meeting.</p>
        <h3>Falsifying absence claims</h3>
        <p>We trust our employees and take our duty of care seriously. If, however, we have reasonable grounds to believe that absence has been taken dishonestly, we will investigate fully and fairly. Where dishonesty is confirmed, disciplinary action will follow, which may include dismissal for gross misconduct.</p>
        <h3>Special unpaid leave</h3>
        <p>In exceptional circumstances, we may agree to grant unpaid leave for personal reasons such as family responsibilities or education. You must use your paid annual leave first. Requests must be submitted in writing directly to the Chair &amp;amp; CEO and must include your reasons and the dates you are requesting. Special unpaid leave is entirely at our discretion and may be declined or withdrawn.</p>
        <p>Please ensure your absence is recorded in Timetastic (our online staff planner).</p>
      </div>
    </div>

    <!-- 3. ALCOHOL, DRUGS AND SMOKING -->
    <div class=&quot;sec-card&quot; id=&quot;s3&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>3</span> Alcohol, Drugs and Smoking</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>The company is committed to the health, safety, and wellbeing of all staff. As a remote-first organisation without a fixed office, this policy applies during all working hours, at staff meetings, away days, client visits, and any other work-related event or gathering.</p>
        <h3>Alcohol</h3>
        <p>Alcohol is not permitted during normal working hours. It is, however, permitted at company social events, away days, staff meetings, and other occasions where it has been expressly authorised by the Chair &amp;amp; CEO.</p>
        <p>Regardless of the occasion, employees are expected to drink responsibly. Attending work, a client visit, or any work-related engagement under the influence of alcohol is classed as gross misconduct and may result in dismissal. Excessive or irresponsible drinking at company events, or behaviour that brings the company into disrepute, will also be treated as a disciplinary matter.</p>
        <h3>Drugs</h3>
        <p>Using, possessing, or distributing illegal drugs during working hours, at staff meetings, away days, client visits, or any work-related event is strictly forbidden and will be treated as gross misconduct. If you are prescribed medication that may affect your ability to work safely, please speak to the Chair &amp;amp; CEO in confidence.</p>
        <p>We reserve the right to search employees and their belongings if there are reasonable grounds to suspect a breach of this policy. Refusing to cooperate with a search may itself be treated as gross misconduct.</p>
        <h3>Smoking and Vaping</h3>
        <p>SDI does not have a fixed company premises. However, all venues used for staff meetings, away days, client visits, and any other work-related gathering are treated as smoke free and vapour free environments. This applies to all employees, customers, visitors, and contractors. Company vehicles, where used, are also smoke free and vapour free.</p>
      </div>
    </div>

    <!-- 4. BEREAVEMENT PAY AND LEAVE -->
    <div class=&quot;sec-card&quot; id=&quot;s4&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>4</span> Bereavement Pay and Leave</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>If you lose a child under the age of 18, and you are the child's legal parent or had day to day caring responsibility for the child, you are entitled to two weeks of statutory parental bereavement leave. The entitlement applies if either condition is met &amp;mdash; you do not need to satisfy both. The same applies if you have suffered a stillbirth after 24 weeks of pregnancy.</p>
        <p>Key points:</p>
        <ul>
          <li>Leave must be taken as one block of two weeks, or as two separate one week blocks.</li>
          <li>Leave must be taken within 56 weeks of the child's death.</li>
          <li>Notice for leave in the first seven weeks: give notice before the leave begins.</li>
          <li>Notice from the eighth week onwards: one week's notice is required.</li>
          <li>Leave can be cancelled or rescheduled using the same notice periods.</li>
          <li>Statutory Parental Bereavement Pay applies if you have been continuously employed for 26 weeks up to the week before the child's death and meet National Insurance thresholds.</li>
        </ul>
        <p>For bereavement involving other close family members, please speak to your line manager. Short periods of paid or unpaid compassionate leave are at the Chair &amp;amp; CEO's discretion.</p>
      </div>
    </div>

    <!-- 5. BONUS -->
    <div class=&quot;sec-card&quot; id=&quot;s5&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>5</span> Bonus</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Any bonus paid by the company is entirely discretionary. Payment is not guaranteed and does not create a contractual entitlement, even if bonuses have been paid in previous years.</p>
        <p>A bonus may take into account company performance, your individual performance, your conduct, or other criteria decided by the company from time to time. The amount is also at the company's discretion.</p>
        <p>To be eligible for a bonus, you must still be employed and not serving notice on the date the bonus is paid and must not have an active formal disciplinary warning for conduct or performance at that time.</p>
        <p>All bonus decisions will be made consistently and without discrimination. The company will not make bonus decisions on the basis of any protected characteristic under the Equality Act 2010.</p>
      </div>
    </div>

    <!-- 6. BUILDING SECURITY AND KEY HOLDERS -->
    <div class=&quot;sec-card&quot; id=&quot;s6&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>6</span> Building Security and Key Holders</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>As a remote-first organisation, SDI does not operate a fixed company premises. If you are ever issued access credentials, keys, or security tokens for a venue, client site, or event space, you are responsible for keeping them safe. Any loss must be reported immediately to the Chair &amp;amp; CEO.</p>
        <p>Company equipment and data must not be shared with or accessed by anyone outside the company without prior authorisation from the Chair &amp;amp; CEO.</p>
      </div>
    </div>

    <!-- 7. CARERS LEAVE -->
    <div class=&quot;sec-card&quot; id=&quot;s7&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>7</span> Carers Leave</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>All employees have a statutory right to take one week of unpaid carer's leave per rolling 12-month period to provide or arrange planned care for a dependant with:</p>
        <ul>
          <li>A physical or mental illness that requires care for at least three months.</li>
          <li>A disability as defined under the Equality Act 2010.</li>
          <li>Care needs due to old age.</li>
        </ul>
        <p>This entitlement does not cover routine childcare. Leave may be taken as a full week, individual days, or half days. A half day is defined as half of your contracted working day. To take this leave, please put your request in writing to your line manager explaining the situation. You must give at least three days' notice, or twice the number of days requested, whichever is earlier.</p>
        <p>If you need more time than your entitlement allows, we may agree for you to use annual leave. We will always try to accommodate your request. If we need to postpone due to business needs, we will confirm this in writing and find a suitable date within one month.</p>
      </div>
    </div>

    <!-- 8. CASH AND STOCK HANDLING -->
    <div class=&quot;sec-card&quot; id=&quot;s8&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>8</span> Cash and Stock Handling</h2></div>
      <div class=&quot;sec-body&quot;>
        <p>Some roles at SDI, particularly those involving events, may require handling of cash, stock, or financial transactions. If your role includes any such responsibility, you must always act with full integrity. You must never do anything that places you under suspicion of dishonesty or misappropriation.</p>
        <p>Any breach may result in disciplinary action including dismissal for gross misconduct. The company reserves the right to refer matters to the police. You may be held responsible for losses caused by your negligence or dishonesty and the amount may be deducted from your pay.</p>
      </div>
    </div>

    <!-- 9. COMPANY EQUIPMENT -->
    <div class=&quot;sec-card&quot; id=&quot;s9&quot;>
      <div class=&quot;sec-head&quot;><h2><span class=&quot;sec-num-badge&quot;>9</span> Company Equipment</h2></div>
      <div class=&quot;sec-body&quot;>
